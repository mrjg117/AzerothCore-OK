name: build-maps

on:
  workflow_dispatch:
  # 定期打包：取消注释启用，三选一（默认只手动）
  # schedule:
  #   - cron: '0 5 * * *'     # 每日 05:00 UTC
  #   - cron: '0 5 * * 1'     # 每周一 05:00 UTC
  #   - cron: '0 5 1 * *'     # 每月 1 号 05:00 UTC

env:
  CLIENT_DATA_REF: v20.0   # wowgaming/client-data Release tag（pinned，换源改这里）

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download wowgaming/client-data@${{ env.CLIENT_DATA_REF }} Data.zip
        run: |
          VER="${{ env.CLIENT_DATA_REF }}"
          echo "Downloading https://github.com/wowgaming/client-data/releases/download/$VER/Data.zip"
          curl -L -o /tmp/data.zip "https://github.com/wowgaming/client-data/releases/download/$VER/Data.zip"
          mkdir -p config/maps/data
          rm -rf /tmp/extracted && mkdir -p /tmp/extracted
          unzip -q /tmp/data.zip -d /tmp/extracted
          # Data.zip 内部可能是 Data/ 顶层目录或直接 Maps/ 等；统一剥到 config/maps/data/ 顶层
          if [ -d /tmp/extracted/Data ]; then
            mv /tmp/extracted/Data/* config/maps/data/
          else
            mv /tmp/extracted/* config/maps/data/
          fi
          echo "--- data layout ---"
          ls -1 config/maps/data

      - name: Compute VERSION
        id: ver
        run: echo "version=$(date +%Y%m%d)-$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Build & push ac-maps (ghcr.io)
        run: |
          TAGS="ghcr.io/${{ github.repository_owner }}/ac-maps:${{ steps.ver.outputs.version }},ghcr.io/${{ github.repository_owner }}/ac-maps:latest"
          BUILDX_TAGS=""
          IFS=',' read -ra _arr <<< "$TAGS"
          for _t in "${_arr[@]}"; do BUILDX_TAGS="$BUILDX_TAGS --tag $_t"; done
          docker buildx build $BUILDX_TAGS --push config/maps

      - name: Save maps image to bundle & upload to external storage (整镜像打包)
        env:
          ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}
          ONEDRIVE_TENANT: ${{ secrets.ONEDRIVE_TENANT }}
          ONEDRIVE_CERT: ${{ secrets.ONEDRIVE_CERT }}
          ONEDRIVE_KEY: ${{ secrets.ONEDRIVE_KEY }}
          ONEDRIVE_DRIVE_ID: ${{ secrets.ONEDRIVE_DRIVE_ID }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_REGION: ${{ secrets.S3_REGION }}
        run: |
          set -e
          NS="ghcr.io/${{ github.repository_owner }}"
          docker pull "$NS/ac-maps:latest"
          docker save "$NS/ac-maps:latest" | zstd -T0 -o ac-maps-latest.tar.zst
          sha256sum ac-maps-latest.tar.zst > ac-maps-latest.tar.zst.sha256
          pip install --quiet msal 2>/dev/null || true
          ./.github/scripts/upload_artifacts.sh "ac-maps-latest.tar.zst"
          ./.github/scripts/upload_artifacts.sh "ac-maps-latest.tar.zst.sha256"

      - name: Cleanup extracted data (不落盘)
        if: always()
        run: rm -rf config/maps/data /tmp/data.zip /tmp/extracted

      - name: Set package visibility public (供服务器匿名 pull)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/user/packages/container/${{ github.repository_owner }}%2Fac-maps/visibility" \
            -d '{"visibility":"public"}'

      - name: Prune old versions (keep latest 12)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP: "12"
        run: |
          set +e
          owner="${{ github.repository_owner }}"
          # 包名形如 owner/repo，斜杠需编码为 %2F（纯 bash，不依赖 python3）
          enc() { local s="$1"; s="${s/\//%2F}"; printf '%s' "$s"; }
          otype=$(gh api "users/$owner" --jq '.type' 2>/dev/null)
          if [ "$otype" = "Organization" ]; then base="orgs/$owner/packages/container"; else base="user/packages/container"; fi
          prune() {
            local pkg="$1" e ids ids_arr=() n i vid
            e=$(enc "$pkg")
            echo "pruning $pkg (enc=$e)"
            ids=$(gh api "$base/$e/versions?per_page=100" --jq 'sort_by(.created_at)|reverse|.[].id' 2>/dev/null)
            if [ -z "$ids" ]; then echo "  no versions, skip"; return 0; fi
            while IFS= read -r line; do [ -n "$line" ] && ids_arr+=("$line"); done <<< "$ids"
            n=${#ids_arr[@]}
            if [ "$n" -le "${KEEP}" ]; then echo "  $n <= ${KEEP}, keep all"; return 0; fi
            echo "  $n versions, deleting $((n-KEEP)) oldest"
            for ((i=KEEP; i<n; i++)); do
              vid="${ids_arr[i]}"
              if gh api -X DELETE "$base/$e/versions/$vid" >/dev/null 2>&1; then echo "  deleted $vid"; else echo "  FAILED $vid"; fi
            done
          }
          prune "$owner/ac-maps"
