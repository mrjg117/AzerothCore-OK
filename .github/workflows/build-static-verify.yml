name: build-static-verify

# 纯官方流程搬到云：把你在本地跑官方 Playerbot 部署那套，原样在 Actions 上跑一遍。
# 唯一叠加：暴露错误(grep 部署日志) + 全干净才冻库打包分发。完全不破坏官方逻辑。
#
# 官方 = mod-playerbots/azerothcore-wotlk @Playerbot 的 docker-compose.yml + Dockerfile
#   - Dockerfile 第 51 行 ARG CMODULES="static" → 官方本就 static，不覆盖、不传参。
#   - 挂载 AzerothCore-OK 的 config/modules.txt 模组 + build-patches/ 补丁（项目侧输入，官方流程之上的必要内容）。
#   - 不碰 ghcr：分发靠 tarball 大包（docker save 本地镜像 + 冻库 + 配置 + 地图），不靠 registry。
#
# 流程（单 job，镜像本地复用，不跨 job 搬）：
#   1) Clone 官方核心 @Playerbot
#   2) 挂 40 模组 + apply build-patches            （项目输入）
#   3) 准备 etc 配置（叠仓库模组 conf，核心 conf 用官方默认）
  #   4) docker compose --profile tools build         （官方编译；跑完暴露全部错误，有错才停在打包前）
  #   5) docker compose up -d --no-build              （官方部署；跑完暴露全部错误，有错才停在打包前）
#   6) grep 暴露 db-import / worldserver 错误        （收全错误，不早退）
#   7) 全干净才冻库（停 mysql→拷数据目录→压）+ 打包（5 镜像 + etc + 冻库 + 地图）→ 上传
#   任一步失败 → 后续不跑（不冻库不打包），日志全暴露。

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'config/**'
      - 'build-patches/**'
      - 'client-patches/**'
      - '.github/workflows/build-static-verify.yml'

permissions:
  contents: read
  actions: write

env:
  ACORE_REF: Playerbot
  CLIENT_DATA_REF: v20.0

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout project (AzerothCore-OK)
        uses: actions/checkout@v4
        with:
          path: project

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Clone official Playerbot core @ ${{ env.ACORE_REF }}
        run: |
          set -e
          git clone --depth 1 https://github.com/mod-playerbots/azerothcore-wotlk.git official
          cd official
          git fetch --depth 1 origin "$ACORE_REF"
          git checkout "$ACORE_REF"
          echo "== cloned official core @ $ACORE_REF =="

      - name: Mount modules (config/modules.txt) + apply build-patches
        run: |
          set -e
          cd official
          # 挂模组：读项目 config/modules.txt，逐个 clone 进 modules/（去 -master 后缀）
          while IFS= read -r url; do
            [ -z "$url" ] && continue
            case "$url" in \#*) continue;; esac
            name=$(basename "$url" .git); name=${name%-master}
            echo "-> $url => modules/$name"
            git clone --depth 1 "$url" "modules/$name"
          done < ../project/config/modules.txt
          # apply 核心/模组 build-patches（项目侧补丁，官方流程之上的输入）
          BP="${{ github.workspace }}/project/build-patches"
          for moddir in "$BP"/*/; do
            [ -d "$moddir" ] || continue
            name=$(basename "$moddir")
            if [ "$name" = "core" ]; then tgt="$PWD"; else tgt="$PWD/modules/$name"; fi
            [ -d "$tgt" ] || { echo "!! target $tgt not found, skip $name"; continue; }
            echo "== build-patches: $name -> $tgt =="
            for p in $(ls "$moddir"*.patch 2>/dev/null | sort); do
              echo "  git-apply: $(basename "$p")"
              ( cd "$tgt" && git apply --3way --whitespace=nowarn "$p" ) || ( cd "$tgt" && patch -p1 --fuzz=5 < "$p" )
            done
            for s in $(ls "$moddir"*.sh 2>/dev/null | sort); do
              echo "  shell: $(basename "$s")"
              ( cd "$tgt" && bash "$s" )
            done
            if [ -d "$moddir/overlay" ]; then
              echo "  overlay: copy $moddir/overlay -> $tgt"
              cp -r "$moddir/overlay/." "$tgt/"
            fi
          done
          echo "modules mounted + patches applied"

      - name: Prepare etc config (叠仓库模组 conf；核心 conf 用官方默认)
        run: |
          set -e
          ETC="${{ github.workspace }}/official/env/dist/etc"
          mkdir -p "$ETC"
          # 仅叠加模组 conf；核心 worldserver.conf/authserver.conf 用官方镜像默认（entrypoint 自动复制），不覆盖以免破坏 DB 连接等默认设置
          for f in $(find "${{ github.workspace }}/project/config/extra-config/confs" -type f -name '*.conf'); do
            b=$(basename "$f")
            case "$b" in worldserver.conf|authserver.conf) continue;; esac
            cp "$f" "$ETC/$b"
          done
          echo "== prepared etc =="; ls -1 "$ETC"

      - name: Write CI .env (占位值，仅验部署链路；密码按官方变量名 DOCKER_DB_ROOT_PASSWORD)
        run: |
          set -e
          cd "${{ github.workspace }}/official"
          printf 'DOCKER_DB_ROOT_PASSWORD=ci-test\nSOAP_LOGIN=ci-test\nSOAP_PASSWORD=ci-test\n' > .env
          echo "== .env written =="; cat .env

      - name: Build core images (官方编译 + core补丁加-k 暴露全部错误；有错停在打包前)
        run: |
          set -e
          cd "${{ github.workspace }}/official"
          # 官方 CMODULES 默认 static（Dockerfile ARG），不覆盖。core build-patch(keep_going.sh) 已给 cmake --build 加 -- -k，遇错继续编译、暴露全部模组错误。
          # --profile tools 放 docker compose 全局位（compose v2 的 --profile 是全局 flag，不能放 build 子命令后），一并编 tools 进大包。
          # 注：官方 cmake --build 本不带 -k（单服务内编译错只报第一个）；经 core build-patch 已加 -- -k 透传 make，现可暴露全部模组编译错误；有错 make 返回非0 -> step 非零退 -> 后续 if:success 不跑 -> 不打包。
          docker compose --profile tools build
          echo "== build done =="

      - name: Bring up stack (官方部署)
        run: |
          set -e
          cd "${{ github.workspace }}/official"
          # --no-build：用刚编好的本地镜像起栈；mysql:8.4 / client-data(从 wowgaming 拉地图) 按官方现场来
          docker compose up -d --no-build
          docker compose ps

      - name: Expose deployment errors (db-import + worldserver；收全不早退)
        if: success()
        run: |
          set -e
          cd "${{ github.workspace }}/official"
          FAIL=0
          # ---- db-import ----
          DI_SEEN=0
          for i in $(seq 1 120); do
            if docker compose ps ac-db-import --status exited -q >/dev/null 2>&1; then DI_SEEN=1; break; fi
            sleep 5
          done
          docker compose logs ac-db-import > /tmp/dbimport.log 2>&1 || true
          echo "==== db-import log tail ===="; tail -n 50 /tmp/dbimport.log
          if [ "$DI_SEEN" != "1" ]; then echo "!! db-import 未退出（镜像缺失/卡死/编排错误）"; FAIL=1; fi
          if grep -Ei 'Unhandled|errno [0-9]|does not exist|Duplicate entry|truncated for column|Unexpected behaviour|ERROR [0-9]' /tmp/dbimport.log; then
            echo "!! db-import 暴露错误（含带病 exit 0）"; FAIL=1
          fi
          # ---- worldserver ----
          WS_SEEN=0
          for i in $(seq 1 120); do
            docker compose ps ac-worldserver --status running -q >/dev/null 2>&1 && WS_SEEN=1
            sleep 5
          done
          if [ "$WS_SEEN" != "1" ]; then echo "!! worldserver 容器未运行（启动失败/崩溃）"; FAIL=1; fi
          # 容器起来了，再等初始化完成，全量扫日志（不早退、不 break）
          sleep 60
          docker compose logs ac-worldserver > /tmp/ws.log 2>&1 || true
          echo "==== worldserver log (full scan) ===="; tail -n 200 /tmp/ws.log
          if grep -Eqi 'ABORT|Could not prepare|Table .* doesn.t exist|Unknown column|Segmentation|SIGSEGV|FATAL|panic|refused to start|cannot (load|open)|failed to initialize' /tmp/ws.log; then
            echo "!! worldserver 暴露致命错误"; FAIL=1
          fi
          if [ "$FAIL" != "0" ]; then echo "!! 部署暴露错误，停（不冻库不打包）"; exit 1; fi
          echo "部署无错误（db-import 完成 + worldserver 运行中且无致命错误）"

      - name: Freeze database (优雅停库→拷数据目录→压缩) 仅部署干净才到这
        if: success()
        run: |
          set -e
          cd "${{ github.workspace }}/official"
          echo "== graceful stop ac-database =="
          docker compose stop ac-database
          for i in $(seq 1 30); do
            docker compose ps ac-database --status running -q >/dev/null 2>&1 || { echo "db stopped"; break; }
            sleep 2
          done
          CID=$(docker compose ps -q ac-database)
          echo "db container id=$CID"
          mkdir -p /tmp/dbdata
          docker cp "$CID:/var/lib/mysql/." /tmp/dbdata/
          tar -cf "${{ github.workspace }}/ac-db-data.tar.zst" -I zstd -C /tmp/dbdata .
          ls -lh "${{ github.workspace }}/ac-db-data.tar.zst"

      - name: Package (5 镜像 + etc + 冻库 + 地图；全干净才打)
        if: success()
        run: |
          set -e
          cd "${{ github.workspace }}/official"
          mkdir -p /tmp/bundle
          # 5 主镜像（官方 tag：docker compose build 编出的本地镜像名）
          docker save \
            acore/ac-wotlk-worldserver:master \
            acore/ac-wotlk-authserver:master \
            acore/ac-wotlk-db-import:master \
            acore/ac-wotlk-tools:master \
            mysql:8.4 \
            -o /tmp/bundle/images.tar
          zstd -o /tmp/bundle/images.tar.zst /tmp/bundle/images.tar && rm /tmp/bundle/images.tar
          # etc（仓库 confs，保留 __SOAP_*__ 占位符供用户机替换）
          mkdir -p /tmp/bundle/etc
          for f in $(find "${{ github.workspace }}/project/config/extra-config/confs" -type f -name '*.conf'); do
            cp "$f" "/tmp/bundle/etc/$(basename "$f")"
          done
          tar -cf /tmp/bundle/etc.tar.zst -I zstd -C /tmp/bundle/etc .
          # 冻库
          cp "${{ github.workspace }}/ac-db-data.tar.zst" /tmp/bundle/
          # 地图（从官方 client-data 卷导出）
          docker run --rm -v ac-client-data:/data -v /tmp/bundle:/out busybox tar -cf - -C /data . | zstd -o /tmp/bundle/ac-maps.tar.zst
          echo "== bundle contents =="; ls -lh /tmp/bundle/

      - name: Build final tarballs + upload
        if: success()
        env:
          ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}
          ONEDRIVE_TENANT: ${{ secrets.ONEDRIVE_TENANT }}
          ONEDRIVE_CERT: ${{ secrets.ONEDRIVE_CERT }}
          ONEDRIVE_KEY: ${{ secrets.ONEDRIVE_KEY }}
          ONEDRIVE_DRIVE_ID: ${{ secrets.ONEDRIVE_DRIVE_ID }}
          ONEDRIVE_USER_ID: ${{ secrets.ONEDRIVE_USER_ID }}
          ONEDRIVE_UPLOAD_PATH: ${{ secrets.ONEDRIVE_UPLOAD_PATH }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_REGION: ${{ secrets.S3_REGION }}
        run: |
          set -e
          cd /tmp/bundle
          tar -cf "${{ github.workspace }}/ac-bundle-latest.tar.zst" -I zstd -C /tmp/bundle .
          cp /tmp/bundle/ac-maps.tar.zst "${{ github.workspace }}/ac-maps-latest.tar.zst"
          cd "${{ github.workspace }}"
          sha256sum ac-bundle-latest.tar.zst > ac-bundle-latest.tar.zst.sha256
          sha256sum ac-maps-latest.tar.zst > ac-maps-latest.tar.zst.sha256
          ls -lh ac-bundle-latest.tar.zst ac-maps-latest.tar.zst
          pip install --quiet msal 2>/dev/null || true
          bash "${{ github.workspace }}/project/.github/scripts/upload_artifacts.sh" "ac-bundle-latest.tar.zst"
          bash "${{ github.workspace }}/project/.github/scripts/upload_artifacts.sh" "ac-bundle-latest.tar.zst.sha256"
          bash "${{ github.workspace }}/project/.github/scripts/upload_artifacts.sh" "ac-maps-latest.tar.zst"
          bash "${{ github.workspace }}/project/.github/scripts/upload_artifacts.sh" "ac-maps-latest.tar.zst.sha256"

      - name: Tear down (数据已冻进包，此处删卷)
        if: always()
        run: |
          cd "${{ github.workspace }}/official"
          docker compose down -v || true
