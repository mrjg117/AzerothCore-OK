name: build-static-verify

# 纯官方流程搬到云：把你在本地跑官方 Playerbot 部署那套，原样在 Actions 上跑一遍。
# 唯一叠加：尽量多暴露错误 + 全干净才冻库打包分发。完全不破坏官方逻辑。
#
# 官方 = mod-playerbots/azerothcore-wotlk @Playerbot 的 docker-compose.yml + Dockerfile
#   - Dockerfile 第 51 行 ARG CMODULES="static" → 官方本就 static，不覆盖、不传参。
#   - 挂载 AzerothCore-OK 的 config/modules.txt 模组 + build-patches/ 补丁（项目侧输入，官方流程之上的必要内容）。
#   - 不碰 ghcr：分发靠 tarball 大包（docker save 本地镜像 + 冻库 + 配置 + 地图），不靠 registry。
#
# 【全链路监控原则（用户铁律）】
#   尽量多的暴露。除「彻底进行不下去」外，所有环节一律跑完、收集全部错误，不中途停。
#   唯一硬停在「打包前」那道 Gate：汇总到的任何错误 → 不冻库不打包，停下来改。
#   - 缓存(3/4) 属可恢复，best-effort，绝不致命。
#   - Clone 核心(5) 是唯一的「彻底进行不下去」例外（无源码后续全无意义），保留硬停、且秒级失败不空转。
#   - 其余所有环节(1–11) 一律 set +e 跑完、错误追加进 /tmp/ci_errors.log、打印全量，step 本体 exit 0（不红、不挡后续）。
#   - Gate 步（打包前）读 /tmp/ci_errors.log：非空 → 打印全部错误并 exit 1（停，不打包）；空 → 进打包。
#   - 每个环节内部也贯彻「暴露全部」：模组/补丁逐个全量 apply，单个失败记下来继续，不 abort 后续补丁。

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'config/**'
      - 'build-patches/**'
      - 'client-patches/**'
      - '.github/workflows/build-static-verify.yml'

permissions:
  contents: read
  actions: write

env:
  ACORE_REF: Playerbot

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout project (AzerothCore-OK)
        uses: actions/checkout@v4
        with:
          path: project

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        id: setup-buildx

      # 缓存 = 可恢复，best-effort，绝不致命。缺失只是少缓存、顶多慢，不该挡构建。
      - name: Cache ccache (跨 run 持久化; 可恢复, 失败不致命)
        continue-on-error: true
        uses: actions/cache@v4
        id: cache-ccache
        with:
          path: /home/runner/.cache/ccache
          key: ccache-${{ github.sha }}
          restore-keys: |
            ccache-

      - name: Restore ccache cache mount (buildkit-cache-dance; 可恢复, 失败不致命)
        continue-on-error: true
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.setup-buildx.outputs.name }}
          cache-map: |
            {
              "/home/runner/.cache/ccache": "/ccache"
            }
          skip-extraction: ${{ steps.cache-ccache.outputs.cache-hit }}

      # 唯一「彻底进行不下去」例外：无官方核心源码，后续全无意义。保留硬停 + 秒级失败。
      - name: Clone official Playerbot core @ ${{ env.ACORE_REF }}
        run: |
          set -e
          git clone --depth 1 https://github.com/mod-playerbots/azerothcore-wotlk.git official
          cd official
          git fetch --depth 1 origin "$ACORE_REF"
          git checkout "$ACORE_REF"
          echo "== cloned official core @ $ACORE_REF =="

      # 全量 apply：模组逐个 clone、补丁逐个贴，单个失败记下来继续，不 abort 后续补丁。
      - name: Mount modules (config/modules.txt) + apply build-patches (全量暴露)
        run: |
          set +e
          : "${CI_ERR:=/tmp/ci_errors.log}"; touch "$CI_ERR"
          rec() { echo "[ERR] $*" | tee -a "$CI_ERR"; }
          cd official
          # 挂模组：读项目 config/modules.txt，逐个 clone 进 modules/（去 -master 后缀）；单个失败记下来继续
          while IFS= read -r url; do
            [ -z "$url" ] && continue
            case "$url" in \#*) continue;; esac
            name=$(basename "$url" .git); name=${name%-master}
            echo "-> $url => modules/$name"
            if git clone --depth 1 "$url" "modules/$name" 2>/tmp/clone.log; then
              : ok
            else
              rec "MODULE CLONE FAIL: $url"; echo "---- clone error ----"; tail -n 20 /tmp/clone.log
            fi
          done < ../project/config/modules.txt
          # apply 核心/模组 build-patches（项目侧补丁，官方流程之上的输入）；全部试一遍，失败记全
          BP="${{ github.workspace }}/project/build-patches"
          # 锁（lock）：build-patches 子目录名若不在 modules.txt 启用集合（且非 core）→ 视为被注释/停用/列表中不存在
          # → 跳过其补丁，不报错。取代旧的 *.disabled 文件名后缀做法：是否启用完全由 modules.txt 列表驱动。
          active=()
          while IFS= read -r url; do
            [ -z "$url" ] && continue
            case "$url" in \#*) continue;; esac
            m=$(basename "$url" .git); m=${m%-master}; active+=("$m")
          done < "${{ github.workspace }}/project/config/modules.txt"
          is_active() { local n="$1"; for a in "${active[@]}"; do [ "$a" = "$n" ] && return 0; done; return 1; }
          for moddir in "$BP"/*/; do
            [ -d "$moddir" ] || continue
            name=$(basename "$moddir")
            # 锁：非 core 且不在启用列表 → 跳过（注释掉 / 列表里不存在 / 已停用）
            if [ "$name" != "core" ] && ! is_active "$name"; then
              echo "!! build-patches/$name 不在 modules.txt 启用列表，跳过其补丁 (lock)"
              continue
            fi
            if [ "$name" = "core" ]; then tgt="$PWD"; else tgt="$PWD/modules/$name"; fi
            [ -d "$tgt" ] || { rec "PATCH TARGET MISSING: $name -> $tgt (模组未 clone 成功)"; continue; }
            echo "== build-patches: $name -> $tgt =="
            for p in $(ls "$moddir"*.patch 2>/dev/null | sort); do
              echo "  patch: $(basename "$p")"
              if ( cd "$tgt" && git apply --3way --whitespace=nowarn "$p" ) 2>/tmp/pa.log; then
                : ok
              elif ( cd "$tgt" && patch -p1 --fuzz=5 < "$p" ) 2>/tmp/pa.log; then
                : ok
              else
                rec "PATCH FAIL: $name / $(basename "$p")"; echo "---- patch error ----"; tail -n 25 /tmp/pa.log
              fi
            done
            for s in $(ls "$moddir"*.sh 2>/dev/null | sort); do
              echo "  shell: $(basename "$s")"
              if ( cd "$tgt" && bash "$s" ) 2>/tmp/sh.log; then
                : ok
              else
                rec "SHELL FAIL: $name / $(basename "$s")"; echo "---- shell error ----"; tail -n 25 /tmp/sh.log
              fi
            done
            if [ -d "$moddir/overlay" ]; then
              echo "  overlay: copy $moddir/overlay -> $tgt"
              if cp -r "$moddir/overlay/." "$tgt/" 2>/tmp/ov.log; then
                : ok
              else
                rec "OVERLAY FAIL: $name"; echo "---- overlay error ----"; tail -n 25 /tmp/ov.log
              fi
            fi
          done
          echo "== modules mounted + patches applied (错误见上方 [ERR] 与 Gate 汇总) =="

      # 通用 SQL 归置引擎（docs R11）：把"放错位置"的模组 SQL 归置到官方 db-import 能扫到的位置。
      # 必须在本步之后执行：apply_core_and_gen_sql.sh 会生成仓库里没有的 SQL（item-affixes）。
      # 全规则驱动、零模组名硬编码、零目录名黑名单；db-import 仍只跑一次。
      - name: Normalize module SQL paths (通用归置引擎; 全量暴露)
        run: |
          set +e
          : "${CI_ERR:=/tmp/ci_errors.log}"; touch "$CI_ERR"
          bash "${{ github.workspace }}/project/.github/scripts/normalize_module_sql.sh" "${{ github.workspace }}/official"
          echo "== module SQL normalized (错误见 [ERR] 与 Gate 汇总) =="

      # 准备 etc 配置（叠仓库模组 conf，核心 conf 用官方默认）；某个 conf 拷失败也记下来继续，不中途停。
      - name: Prepare etc config (叠仓库模组 conf; 全量暴露)
        run: |
          set +e
          : "${CI_ERR:=/tmp/ci_errors.log}"; touch "$CI_ERR"
          rec() { echo "[ERR] $*" | tee -a "$CI_ERR"; }
          ETC="${{ github.workspace }}/official/env/dist/etc"
          mkdir -p "$ETC"
          # 仅叠加模组 conf；核心 worldserver.conf/authserver.conf 用官方镜像默认（entrypoint 自动复制），不覆盖以免破坏 DB 连接等默认设置
          for f in $(find "${{ github.workspace }}/project/config/extra-config/confs" -type f -name '*.conf'); do
            b=$(basename "$f")
            case "$b" in worldserver.conf|authserver.conf) continue;; esac
            if cp "$f" "$ETC/$b" 2>/tmp/cp.log; then
              echo "copied $b"
            else
              rec "ETC COPY FAIL: $b"; echo "---- cp error ----"; tail -n 15 /tmp/cp.log
            fi
          done
          echo "== prepared etc =="; ls -1 "$ETC" 2>/dev/null

      # 写 CI 临时 .env（占位值，仅验部署链路；密码按官方变量名 DOCKER_DB_ROOT_PASSWORD）；写失败记下来继续。
      - name: Write CI .env (占位值, 仅验部署链路)
        run: |
          set +e
          : "${CI_ERR:=/tmp/ci_errors.log}"; touch "$CI_ERR"
          rec() { echo "[ERR] $*" | tee -a "$CI_ERR"; }
          cd "${{ github.workspace }}/official"
          if printf 'DOCKER_DB_ROOT_PASSWORD=password\nSOAP_LOGIN=ci-test\nSOAP_PASSWORD=ci-test\n' > .env 2>/tmp/env.log; then
            echo "== .env written =="; cat .env
          else
            rec "ENV WRITE FAIL"; tail -n 15 /tmp/env.log
          fi

      # 地图完全交给官方流程：Bring up 阶段 ac-client-data-init 服务跑官方 client-data 镜像
      # (CMD=inst_download_client_data)，从官方 GitHub release 拉真实地图灌进 ac-client-data 卷。不自造下载。

      # 编译：core build-patch 已给 cmake --build 加 -- -k 0（Ninja 无限继续），暴露全部模组编译错；
      # 退出码非零记错误，并额外扫编译日志红标暴露。step 本体 exit 0，不挡后续（Gate 汇总停打包）。
      - name: Build core images (官方编译 + -k 0 暴露全部编译错; 全量暴露)
        run: |
          set +e
          : "${CI_ERR:=/tmp/ci_errors.log}"; touch "$CI_ERR"
          rec() { echo "[ERR] $*" | tee -a "$CI_ERR"; }
          cd "${{ github.workspace }}/official"
          mkdir -p /home/runner/.cache/ccache
          # 缓存：docker-compose.override.yml 给各 build 服务加 build.cache_from/to: type=gha（编译层缓存）。
          #   ccache 跨 run 复用走 buildkit-cache-dance（见上方 Restore ccache cache mount step）：
          #   官方 Dockerfile `RUN --mount=type=cache,target=/ccache` 是 BuildKit named cache，不被任何
          #   --cache-to 后端导出；cache-dance 把 actions/cache 持久化的宿主 /home/runner/.cache/ccache
          #   注入/提取进构建容器 /ccache，实现 ccache 真复用。均为项目侧 CI，不改任何官方文件。
          #   效果：同内容 .o 命中 ccache 秒过；源码变了对应目标自动重编（内容寻址，不掩盖错误）。
          cp "${{ github.workspace }}/project/docker-compose.override.yml" ./docker-compose.override.yml
          # 官方 CMODULES 默认 static（Dockerfile ARG），不覆盖。core build-patch(keep_going.sh) 已给 cmake --build 加 -- -k 0（官方用 Ninja 生成器，-k 必须带数字 0=无限继续），遇错继续编译、暴露全部模组错误。
          # --profile tools 放 docker compose 全局位（compose v2 的 --profile 是全局 flag，不能放 build 子命令后），一并编 tools 进大包。
          BUILDKIT_PROGRESS=plain docker compose --profile tools build 2>&1 | tee /tmp/build.log
          BRC=${PIPESTATUS[0]}
          echo "== build 退出码 = $BRC =="
          if [ "$BRC" != "0" ]; then rec "BUILD: docker compose build 返回非零($BRC)"; fi
          echo "== 编译错误关键字扫描（error:/FAILED/undefined reference/Error） =="
          grep -Ea 'error:|FAILED|undefined reference|Error ' /tmp/build.log | head -60 || true
          echo "== build done (完整日志见 build-log 工件；错误见 [ERR] 与 Gate 汇总) =="

      - name: Upload build log (完整编译日志; 失败也传)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          if-no-files-found: warn

      # 拉起整套服务：官方部署。compose up 返回非零（某服务未正常起）吸掉，交 Verify 抓日志。不硬停。
      - name: Bring up stack (官方部署：官方 ac-client-data-init 拉地图灌卷; 全量暴露)
        run: |
          set +e
          : "${CI_ERR:=/tmp/ci_errors.log}"; touch "$CI_ERR"
          rec() { echo "[ERR] $*" | tee -a "$CI_ERR"; }
          cd "${{ github.workspace }}/official"
          # 官方部署：docker compose up -d 依次起
          #   ac-database(mysql, healthcheck) ->
          #   ac-db-import(灌 SQL：建库+base+updates，一次性 exit0) ->
          #   ac-client-data-init(跑官方 client-data 镜像 CMD=inst_download_client_data，从官方 GitHub release 拉地图灌进 ac-client-data 卷) ->
          #   ac-worldserver(depends_on 三条件全满足才起，挂同一卷读 maps) + ac-authserver。
          # 地图完全由官方流程负责，不自造下载、不关 init、不改卷名。
          # 官方 bind-mount 权限坑（官方 entrypoint 警告明写）：CI 里 Docker 守护是 root，自动建的 ./env/dist/etc|logs 是 root 所有，
          #   容器以 acore(uid1000) 跑 -> entrypoint cp 失败 -> exit1。复刻官方本地前置：预建目录并交给 uid1000。
          mkdir -p env/dist/etc env/dist/logs
          chown -R 1000:1000 env/dist 2>/dev/null || sudo chown -R 1000:1000 env/dist
          # 用刚编好的本地镜像起栈；官方 client-data/init 镜像由 compose 按 image: 拉取并运行(inst_download_client_data 灌地图)。
          docker compose up -d
          URC=$?
          echo "== docker compose up -d 退出码 = $URC =="
          if [ "$URC" != "0" ]; then rec "BRING-UP: docker compose up -d 返回非零($URC)（有服务未正常起/退出，Verify 会抓日志）"; fi
          docker compose ps

      # Verify：收集全部部署错误进 /tmp/ci_errors.log 并打印，step 本体 exit 0（不红、不挡）。
      # 轮询只等「完成信号」(ready/exited)，错误检测在末尾全量扫（累积流，非 tail 截断）。致命判据只在 Gate 汇总停打包。
      - name: Verify deployment (收集全部部署错误; 全量暴露)
        run: |
          set +e
          : "${CI_ERR:=/tmp/ci_errors.log}"; touch "$CI_ERR"
          rec() { echo "[ERR] $*" | tee -a "$CI_ERR"; }
          cd "${{ github.workspace }}/official"
          set -a; [ -f .env ] && . ./.env; set +a
          FAIL=0
          # 通用错误信号：AC 自身用红色前景 [31;1m / [1;31m 标注错误（不枚举任何具体文案）。
          # docker compose logs 在 CI 无 TTY 仍转发容器 stdout 的 ANSI 颜色码，AC 控制台输出带色。
          ESC=$(printf '\033')
          RED_RE="${ESC}\[[0-9;]*31m"

          # ===== 0) ac-database 进程状态（崩溃即 FAIL，兜底 mysql 自启失败）=====
          DB_CID=$(docker compose ps -q ac-database 2>/dev/null)
          if [ -n "$DB_CID" ]; then
            DB_ST=$(docker inspect -f '{{.State.Status}}' "$DB_CID" 2>/dev/null)
            DB_EC=$(docker inspect -f '{{.State.ExitCode}}' "$DB_CID" 2>/dev/null)
            if [ "$DB_ST" = "exited" ] && [ "${DB_EC:-0}" != "0" ]; then echo "!! ac-database 崩溃退出($DB_EC)"; rec "VERIFY: ac-database 崩溃退出($DB_EC)"; FAIL=1; fi
          fi

          # ===== 1) db-import（一次性任务：exit 非0 即失败）=====
          docker compose logs ac-db-import > /tmp/dbimport.log 2>&1 || true
          echo "==== db-import log (FULL) ===="; cat -v /tmp/dbimport.log | sed 's/\^\[\[[0-9;]*m//g' | tail -n 60
          DI_RC=$(docker inspect -f '{{.State.ExitCode}}' ac-db-import 2>/dev/null || echo "NA")
          echo "ac-db-import exit code = $DI_RC"
          if [ "$DI_RC" != "0" ] && [ "$DI_RC" != "NA" ]; then echo "!! ac-db-import 异常退出($DI_RC)"; rec "VERIFY: ac-db-import 异常退出($DI_RC)"; FAIL=1; fi

          # ===== 2) worldserver：轮询只等"完成信号"(ready / exited)，不当错误探测器 =====
          WS_READY=0; WS_EXITED=0; WS_CODE=0
          for i in $(seq 1 90); do
            CID=$(docker compose ps -q ac-worldserver 2>/dev/null)
            if [ -n "$CID" ]; then
              ST=$(docker inspect -f '{{.State.Status}}' "$CID" 2>/dev/null)
              EC=$(docker inspect -f '{{.State.ExitCode}}' "$CID" 2>/dev/null)
              if [ "$ST" = "exited" ]; then WS_EXITED=1; WS_CODE=$EC; break; fi
            fi
            docker compose logs ac-worldserver 2>/dev/null > /tmp/ws.log || true
            if grep -Eqi 'azerothcore>|WorldSession|World initialized|server is (now )?accepting|Worldserver is ready' /tmp/ws.log; then WS_READY=1; break; fi
            sleep 10
          done
          docker compose logs ac-worldserver 2>/dev/null > /tmp/ws.log || true
          echo "==== worldserver log (FULL scan, last 400 for review) ===="; cat -v /tmp/ws.log | sed 's/\^\[\[[0-9;]*m//g' | tail -n 400
          # 最终进程状态复核（覆盖"ready 后又崩"低概率）
          CID=$(docker compose ps -q ac-worldserver 2>/dev/null)
          if [ -n "$CID" ]; then
            ST=$(docker inspect -f '{{.State.Status}}' "$CID" 2>/dev/null)
            EC=$(docker inspect -f '{{.State.ExitCode}}' "$CID" 2>/dev/null)
            if [ "$ST" = "exited" ] && [ "${EC:-0}" != "0" ]; then echo "!! worldserver 崩溃退出(code=$EC)"; rec "VERIFY: worldserver 崩溃退出(code=$EC)"; FAIL=1; fi
          fi
          if [ "$WS_READY" != "1" ] && [ "$WS_EXITED" != "1" ]; then echo "!! worldserver 超时未 ready 也未崩溃（起不来）"; rec "VERIFY: worldserver 超时未 ready 也未崩溃"; FAIL=1; fi

          # ===== 2b) 地图落地硬校验：官方 ac-client-data-init 灌的卷内 maps/dbc/vmaps/mmaps/Cameras 必须非空 =====
          WS_CID=$(docker compose ps -q ac-worldserver 2>/dev/null)
          if [ -n "$WS_CID" ]; then
            for d in maps dbc vmaps mmaps Cameras; do
              c=$(docker compose exec -T ac-worldserver sh -c "ls /azerothcore/env/dist/data/$d 2>/dev/null | wc -l" 2>/dev/null)
              echo "worldserver data/$d files = ${c:-0}"
              if [ "${c:-0}" -eq 0 ]; then echo "!! worldserver 内 data/$d 为空（官方地图未灌入，拿下来跑不起来）"; rec "VERIFY: worldserver data/$d 为空（官方地图未灌入）"; FAIL=1; fi
            done
          else
            echo "（worldserver 已退出，跳过容器内地图校验；上方崩溃检查已捕获）"
          fi

          # ===== 3) authserver：同理。就绪信号 = 官方实际打印的 'Added realm "..." at IP:PORT.' =====
          AS_READY=0; AS_EXITED=0; AS_CODE=0
          for i in $(seq 1 30); do
            CID=$(docker compose ps -q ac-authserver 2>/dev/null)
            if [ -n "$CID" ]; then
              ST=$(docker inspect -f '{{.State.Status}}' "$CID" 2>/dev/null)
              EC=$(docker inspect -f '{{.State.ExitCode}}' "$CID" 2>/dev/null)
              if [ "$ST" = "exited" ]; then AS_EXITED=1; AS_CODE=$EC; break; fi
            fi
            docker compose logs ac-authserver 2>/dev/null > /tmp/as.log || true
            if grep -Eqi 'Added realm|authserver .* is (now )?ready|started auth' /tmp/as.log; then AS_READY=1; break; fi
            sleep 5
          done
          docker compose logs ac-authserver 2>/dev/null > /tmp/as.log || true
          echo "==== authserver log (FULL scan, last 200 for review) ===="; cat -v /tmp/as.log | sed 's/\^\[\[[0-9;]*m//g' | tail -n 200
          CID=$(docker compose ps -q ac-authserver 2>/dev/null)
          if [ -n "$CID" ]; then
            ST=$(docker inspect -f '{{.State.Status}}' "$CID" 2>/dev/null)
            EC=$(docker inspect -f '{{.State.ExitCode}}' "$CID" 2>/dev/null)
            if [ "$ST" = "exited" ] && [ "${EC:-0}" != "0" ]; then echo "!! authserver 崩溃退出(code=$EC)"; rec "VERIFY: authserver 崩溃退出(code=$EC)"; FAIL=1; fi
          fi
          if [ "$AS_READY" != "1" ] && [ "$AS_EXITED" != "1" ]; then echo "!! authserver 超时未 ready 也未崩溃"; rec "VERIFY: authserver 超时未 ready 也未崩溃"; FAIL=1; fi

          # ===== 4) 库非空（auto-populate 失败才空）=====
          check_lib() {
            local lib="$1"; local T=0
            if docker compose exec -T ac-database mysql -uroot -p"$DOCKER_DB_ROOT_PASSWORD" -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='$lib'" >/tmp/lib.log 2>&1; then
              T=$(grep -Eo '[0-9]+' /tmp/lib.log | head -1)
            fi
            echo "$lib tables = ${T:-0}"
            if [ "${T:-0}" -eq 0 ]; then echo "!! 库 $lib 为空（auto-populate 失败）"; rec "VERIFY: 库 $lib 为空（auto-populate 失败）"; FAIL=1; fi
          }
          MOD_LIBS=$(docker compose exec -T ac-database mysql -uroot -p"$DOCKER_DB_ROOT_PASSWORD" -N -e "SELECT schema_name FROM information_schema.schemata WHERE schema_name LIKE 'acore_%'" 2>/dev/null | grep -vE '^(acore_auth|acore_characters|acore_world)$' | tr -d '\r')
          if [ -n "$MOD_LIBS" ]; then for lib in $MOD_LIBS; do check_lib "$lib"; done; else echo "（无额外模组独立库，跳过）"; fi
          for lib in acore_auth acore_characters acore_world; do check_lib "$lib"; done
          # 4b) 模组 data/sql base 目录缺失铁证（auto-populate 找不到 SQL，真失败）
          if grep -Eqi 'Directory .*/data/sql/.*/base/ not exist' /tmp/ws.log; then echo "!! 模组 data/sql base 目录缺失（auto-populate 失败）"; rec "VERIFY: 模组 data/sql base 目录缺失"; FAIL=1; fi

          # ===== 5) 诊断输出（AC 红色行仅打印，不当致命——官方镜像自带这些非致命告警，官方自己带它们跑）=====
          echo "==== 诊断：worldserver 红色错误行（仅参考，非致命） ===="
          grep -Ea "$RED_RE" /tmp/ws.log | cat -v | sed 's/\^\[\[[0-9;]*m//g' | head -20 || true
          echo "==== 诊断：authserver 红色错误行（仅参考，非致命） ===="
          grep -Ea "$RED_RE" /tmp/as.log | cat -v | sed 's/\^\[\[[0-9;]*m//g' | head -20 || true

          if [ "$FAIL" != "0" ]; then echo "!! 部署暴露错误（已记入 /tmp/ci_errors.log，交 Gate 步停打包）"; else echo "部署本地检查无致命错误（Gate 汇总全部环节后最终判定）"; fi

      # ===== 模组 SQL 完整性校验（docs R11 / 4.4.1）=====
      # L1 声明级：遍历所有模组 .sql 抽 CREATE TABLE / ALTER TABLE ADD COLUMN，与 information_schema 对账。
      #           直击"表/列是否存在"这个目标，不靠"文件是否应用"当代理指标。
      # L2 文件级：合规路径 .sql 集合 vs AC 账本（覆盖 MODULE/CUSTOM/RELEASED 三种 state）。
      #           补 L1 盲区——纯 INSERT/UPDATE 的 data-only 文件漏灌。
      # 命中即 rec() 记 [ERR]，由 Gate 统一拦下不打包。
      - name: Verify module SQL completeness (L1 声明级 + L2 文件级对账)
        run: |
          set +e
          : "${CI_ERR:=/tmp/ci_errors.log}"; touch "$CI_ERR"
          rec() { echo "[ERR] $*" | tee -a "$CI_ERR"; }
          cd "${{ github.workspace }}/official"
          set -a; [ -f .env ] && . ./.env; set +a
          SCHEMAS="acore_auth acore_characters acore_world acore_playerbots"
          IN_LIST=""; for s in $SCHEMAS; do IN_LIST="$IN_LIST'$s',"; done; IN_LIST="${IN_LIST%,}"
          DBQ() { docker compose exec -T ac-database mysql -uroot -p"$DOCKER_DB_ROOT_PASSWORD" -N -e "$1" 2>/dev/null | grep -v Warning | tr -d '\r' | sort -u; }

          DBQ "SELECT table_name FROM information_schema.tables WHERE table_schema IN ($IN_LIST);" > /tmp/db_tables.txt
          DBQ "SELECT CONCAT(table_name,'|',column_name) FROM information_schema.columns WHERE table_schema IN ($IN_LIST);" > /tmp/db_cols.txt

          # ---- L1 声明级 ----
          find modules -name "*.sql" -type f -print0 | xargs -0 grep -ohiE "CREATE[[:space:]]+TABLE[[:space:]]+(IF[[:space:]]+NOT[[:space:]]+EXISTS[[:space:]]+)?[\`][A-Za-z_][A-Za-z0-9_]*[\`]" \
            | grep -oE "[A-Za-z_][A-Za-z0-9_]*\`$" | tr -d '`' | sort -u > /tmp/decl_tables.txt
          find modules -name "*.sql" -type f -print0 | xargs -0 grep -ohiE "ALTER[[:space:]]+TABLE[[:space:]]+[\`][A-Za-z_][A-Za-z0-9_]*[\`][[:space:]]+ADD[[:space:]]+(COLUMN[[:space:]]+)?(IF[[:space:]]+NOT[[:space:]]+EXISTS[[:space:]]+)?[\`][A-Za-z_][A-Za-z0-9_]*[\`]" \
            | sed -E 's/ALTER[[:space:]]+TABLE[[:space:]]+//I; s/[\`]//g; s/[[:space:]]+ADD([[:space:]]+COLUMN)?([[:space:]]+IF[[:space:]]+NOT[[:space:]]+EXISTS)?[[:space:]]+/|/I' | sort -u > /tmp/decl_cols.txt
          # 排除"被同仓库后续 DROP TABLE 取代"的废弃表（如 mod-item-affixes 的 character_meta_progression
          # 被 character_progression_nodes.sql 里的 DROP TABLE 取代）。通用规则，不写死表名。
          find modules -name "*.sql" -type f -print0 | xargs -0 grep -ohiE "DROP[[:space:]]+TABLE([[:space:]]+IF[[:space:]]+EXISTS)?[[:space:]]+[\`][A-Za-z_][A-Za-z0-9_]*[\`]" \
            | grep -oE "[A-Za-z_][A-Za-z0-9_]*\`$" | tr -d '`' | sort -u > /tmp/dropped_tables.txt
          comm -23 /tmp/decl_tables.txt /tmp/dropped_tables.txt > /tmp/decl_tables_eff.txt
          echo "== L1: 模组声明表 $(wc -l < /tmp/decl_tables.txt)（排除已废弃 $(wc -l < /tmp/dropped_tables.txt)）→ 有效 $(wc -l < /tmp/decl_tables_eff.txt) / 库内表 $(wc -l < /tmp/db_tables.txt) =="
          comm -23 /tmp/decl_tables_eff.txt /tmp/db_tables.txt > /tmp/miss_tables.txt
          if [ -s /tmp/miss_tables.txt ]; then echo "!! 声明了但库里没有的表:"; cat /tmp/miss_tables.txt; while read -r t; do [ -n "$t" ] && rec "SQL-L1: 表缺失 $t"; done < /tmp/miss_tables.txt; fi
          echo "== L1: 模组声明列 $(wc -l < /tmp/decl_cols.txt) =="
          comm -23 /tmp/decl_cols.txt /tmp/db_cols.txt > /tmp/miss_cols.txt
          if [ -s /tmp/miss_cols.txt ]; then echo "!! 声明了但库里没有的列:"; cat /tmp/miss_cols.txt; while read -r c; do [ -n "$c" ] && rec "SQL-L1: 列缺失 $c"; done < /tmp/miss_cols.txt; fi

          # ---- L2 文件级 ----
          # mod-playerbots 不完全排除，只排除两个不该进账本的目录：
          #   base/   —— 由模组自身安装器应用，不进 updates 账本（排除它，否则满屏假缺失）
          #   create/ —— 不在 updates_include 白名单内（含 drop_mysql.sql，本就不该灌）
          # 保留 updates/ custom/ archive/ —— 这三个是其 updates_include 白名单目录，必须全都进账本。
          find modules -name "*.sql" -type f | grep -iE "/data/sql/[^/]*(auth|characters|world|playerbots)[^/]*/" \
            | grep -vE "/mod-playerbots/data/sql/playerbots/(base|create)/" \
            | grep -viE "/(create|drop)_mysql(_8)?\.sql$|/updates\.sql$|/updates_include\.sql$|/version_db_[a-z]+\.sql$" \
            | sed 's#.*/##' | sort -u > /tmp/exp_files.txt
          : > /tmp/app_files.txt
          for s in $SCHEMAS; do DBQ "SELECT name FROM $s.updates WHERE state IN ('MODULE','CUSTOM','RELEASED');" >> /tmp/app_files.txt; done
          sort -u /tmp/app_files.txt -o /tmp/app_files.txt
          echo "== L2: 期望灌入 $(wc -l < /tmp/exp_files.txt) / 账本已记 $(wc -l < /tmp/app_files.txt) =="
          comm -23 /tmp/exp_files.txt /tmp/app_files.txt > /tmp/miss_files.txt
          if [ -s /tmp/miss_files.txt ]; then echo "!! 该灌未灌:"; cat /tmp/miss_files.txt; while read -r n; do [ -n "$n" ] && rec "SQL-L2: 文件未灌入 $n"; done < /tmp/miss_files.txt; fi
          echo "== 模组 SQL 完整性校验完成（错误见 [ERR] 与 Gate 汇总）=="

      # ===== 打包前 Gate：全链路唯一硬停点 =====
      # 读 /tmp/ci_errors.log：非空 → 打印全部错误并 exit 1（停，不冻库不打包）；空 → 进打包分发。
      - name: Gate (打包前最终判定：有暴露错误则停, 不打包)
        run: |
          set -e
          if [ -s /tmp/ci_errors.log ]; then
            echo "!!==== 全链路暴露的错误汇总（共 $(wc -l < /tmp/ci_errors.log) 条）===="
            cat /tmp/ci_errors.log
            echo "!! 存在暴露的错误，停，不冻库不打包，回去改。===="
            exit 1
          fi
          echo "全链路无暴露错误，进入打包分发。"

      - name: Freeze database (优雅停库→拷数据目录→压缩) 仅部署干净才到这
        if: success()
        run: |
          set -e
          cd "${{ github.workspace }}/official"
          echo "== graceful stop ac-database =="
          docker compose stop ac-database
          for i in $(seq 1 30); do
            docker compose ps ac-database --status running -q >/dev/null 2>&1 || { echo "db stopped"; break; }
            sleep 2
          done
          CID=$(docker compose ps -q --all ac-database)
          echo "db container id=$CID"
          mkdir -p /tmp/dbdata
          docker cp "$CID:/var/lib/mysql/." /tmp/dbdata/
          tar -cf "${{ github.workspace }}/ac-db-data.tar.zst" -I zstd -C /tmp/dbdata .
          ls -lh "${{ github.workspace }}/ac-db-data.tar.zst"

      - name: Package (5 镜像 + etc + 冻库 + 地图；全干净才打)
        if: success()
        run: |
          set -e
          cd "${{ github.workspace }}/official"
          mkdir -p /tmp/bundle
          # 5 主镜像（官方 tag：docker compose build 编出的本地镜像名）
          docker save \
            acore/ac-wotlk-worldserver:master \
            acore/ac-wotlk-authserver:master \
            acore/ac-wotlk-db-import:master \
            acore/ac-wotlk-tools:master \
            mysql:8.4 \
            -o /tmp/bundle/images.tar
          zstd -o /tmp/bundle/images.tar.zst /tmp/bundle/images.tar && rm /tmp/bundle/images.tar
          # 注：配置不打进包。核心 worldserver.conf/authserver.conf 与模组 conf 均不随包分发，
          # 解包后由官方 entrypoint 从 .dist 生成完整默认（核心）、模组缺失键回退 C++ 默认。
          # 部署时如需定制（如 SOAP），由用户机部署脚本追写，不污染默认基线。
          # 冻库
          cp "${{ github.workspace }}/ac-db-data.tar.zst" /tmp/bundle/
          # 地图（从官方 client-data 卷导出）→ 直接解到 env/dist/data，真机 bind-mount 即读，零归位
          # 非空护栏：地图必须真在卷里（官方流程灌入），否则阻断打包。
          VOL=$(docker volume ls -q | grep -E '_ac-client-data$' | head -1)
          [ -n "$VOL" ] || VOL=ac-client-data
          echo "map volume = $VOL"
          CNT=$(docker run --rm -v "$VOL":/data busybox sh -c "find /data -type f | wc -l")
          echo "map data file count = $CNT"
          if [ "${CNT:-0}" -eq 0 ]; then echo "!! 地图卷为空，阻断打包"; exit 1; fi
          docker run --rm -v "$VOL":/data busybox sh -c "ls -d /data/maps /data/dbc /data/vmaps /data/mmaps >/dev/null 2>&1 || { echo MISSING_DIRS; exit 1; }"
          docker run --rm -v "$VOL":/data -v /tmp/bundle:/out busybox sh -c 'mkdir -p /out/env/dist/data && tar -cf - -C /data . | tar -xf - -C /out/env/dist/data'
          echo "== bundle contents =="; ls -lh /tmp/bundle/

      - name: Build final tarballs + upload
        if: success()
        env:
          ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}
          ONEDRIVE_TENANT: ${{ secrets.ONEDRIVE_TENANT }}
          ONEDRIVE_CERT: ${{ secrets.ONEDRIVE_CERT }}
          ONEDRIVE_KEY: ${{ secrets.ONEDRIVE_KEY }}
          ONEDRIVE_DRIVE_ID: ${{ secrets.ONEDRIVE_DRIVE_ID }}
          ONEDRIVE_USER_ID: ${{ secrets.ONEDRIVE_USER_ID }}
          ONEDRIVE_UPLOAD_PATH: ${{ secrets.ONEDRIVE_UPLOAD_PATH }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_REGION: ${{ secrets.S3_REGION }}
        run: |
          set -e
          cd /tmp/bundle
          tar -cf "${{ github.workspace }}/ac-bundle-latest.tar.zst" -I zstd -C /tmp/bundle .
          cd "${{ github.workspace }}"
          sha256sum ac-bundle-latest.tar.zst > ac-bundle-latest.tar.zst.sha256
          ls -lh ac-bundle-latest.tar.zst
          pip install --quiet msal 2>/dev/null || true
          bash "${{ github.workspace }}/project/.github/scripts/upload_artifacts.sh" "ac-bundle-latest.tar.zst"
          bash "${{ github.workspace }}/project/.github/scripts/upload_artifacts.sh" "ac-bundle-latest.tar.zst.sha256"

      - name: Tear down (数据已冻进包，此处删卷)
        if: always()
        run: |
          cd "${{ github.workspace }}/official"
          docker compose down -v || true
