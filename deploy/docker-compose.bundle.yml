# AzerothCore-OK —— 大包部署 compose（绑定挂载配置/地图/冻库，镜像走官方名，不依赖 ghcr）
#
# 用法（下载两个包后）：
#   1) 解 ac-bundle-latest.tar.zst：
#        mkdir -p dist && tar -xf ac-bundle-latest.tar.zst -C dist
#        # dist/ 内含：images.tar.zst（5 主镜像）+ etc.tar.zst（配置，含 __SOAP_*__ 占位符）+ ac-db-data.tar.zst（冻库）
#      docker load dist/images.tar.zst        # 本地得到 acore/ac-wotlk-*:master + mysql:8.4
#      解压配置： mkdir -p ./env/dist/etc && tar -xf dist/etc.tar.zst -C ./env/dist/etc
#      解压冻库： mkdir -p ./env/dist/mysql-data && tar -xf dist/ac-db-data.tar.zst -C ./env/dist/mysql-data
#   2) 解地图（单独包，便于单独更新）：
#        mkdir -p ./env/dist/data && tar -xf ac-maps-latest.tar.zst -C ./env/dist/data
#   3) cp .env.example .env  并填真实 SOAP_LOGIN / SOAP_PASSWORD / REALM_ADDRESS / DOCKER_DB_ROOT_PASSWORD
#   4) bash deploy/inject-config.sh            （用本机 .env 替换 ./env/dist/etc 里的 __SOAP_*__ 占位符）
#   5) docker compose -f docker-compose.bundle.yml up -d
#
# 镜像名 = CI 用官方 docker compose build 编出的本地 tag（acore/ac-wotlk-*:master / mysql:8.4），
# 与官方 Playerbot 流程完全一致，不烤 ghcr 名。配置/地图/冻库均来自仓库与 wowgaming（别人仓库），不烤进镜像。
services:
  ac-database:
    image: mysql:8.4
    environment:
      DOCKER_DB_ROOT_PASSWORD: ${DOCKER_DB_ROOT_PASSWORD:-ci-test}
    volumes:
      - ./env/dist/mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DOCKER_DB_ROOT_PASSWORD:-ci-test}"]
      interval: 10s
      timeout: 5s
      retries: 20

  ac-db-import:
    image: acore/ac-wotlk-db-import:master
    depends_on:
      ac-database:
        condition: service_healthy
    volumes:
      - ./env/dist/etc:/azerothcore/env/dist/etc

  ac-worldserver:
    image: acore/ac-wotlk-worldserver:master
    depends_on:
      ac-database:
        condition: service_healthy
      ac-db-import:
        condition: service_completed_successfully
    environment:
      - REALM_ADDRESS=${REALM_ADDRESS}
    volumes:
      - ./env/dist/etc:/azerothcore/env/dist/etc
      - ./env/dist/data:/azerothcore/env/dist/data:ro

  ac-authserver:
    image: acore/ac-wotlk-authserver:master
    depends_on:
      ac-database:
        condition: service_healthy
      ac-db-import:
        condition: service_completed_successfully
    volumes:
      - ./env/dist/etc:/azerothcore/env/dist/etc
