# =========================================
# mod-prayer-of-mending 模组配置（真言术：盾之愈合 / Prayer of Mending）
# 用途：将牧师“愈合祷言”改为《地心之战》(SoD) 风格，目标受到治疗时也会触发跳跃。
# 说明：本文件所有设置均已注释，按需取消注释（去掉行首 # ）以启用。
# =========================================

[worldserver]

# ===== 基础行为 =====

# 启用 SoD 风格愈合祷言：目标受到治疗时也会触发（除原版受击触发外） - 默认 1（启用，0=禁用，使用 WotLK 原版）
# PrayerOfMending.OnHeal.Enable = 1

# ===== 日志 =====

# 启用详细日志（在服务器日志中输出 PoM-DEBUG 行） - 默认 0（禁用，1=启用）
# PrayerOfMending.OnHeal.Debug = 0
