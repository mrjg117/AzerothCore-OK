#
# mod-challenge-modes（挑战模式模组）
# 用途：在起始区域提供挑战模式选择器，玩家可自选「硬核 / 慢经验 / 自造装备」等规则集，
#       达成等级时还可奖励称号、天赋点、物品、成就等。以下所有设置默认全部注释，
#       按需取消注释即可开启对应挑战。
#

[worldserver]

########################################
# ===== 总开关 =====
########################################

# 挑战模式总开关。设为 0 则所有挑战关闭，且起始区域不会出现挑战模式选择器 - 默认 1
# ChallengeModes.Enable = 1

########################################
# ===== 硬核 (Hardcore) =====
# 规则：玩家一旦死亡将永久变为幽灵，无法复活。
########################################

# 是否在选择器上提供「硬核」挑战（1=可选，0=不可选） - 默认 1
# Hardcore.Enable = 1

# 达到指定等级时奖励称号。格式为"等级 称号ID"，多个用逗号分隔（ID 取自 CharTitles.dbc）。留空表示无 - 默认 ""
# Hardcore.TitleRewards = ""

# 启用该挑战时玩家获得经验的倍率（乘法叠加）。设为 1 即无额外倍率 - 默认 1
# Hardcore.XPMultiplier = 1

# 达到指定等级时奖励天赋点。格式为"等级 天赋点数"，多个用逗号分隔。留空表示无 - 默认 ""
# Hardcore.TalentRewards = ""

# 达到指定等级时奖励物品。格式为"等级 物品ID"，多个用逗号分隔。留空表示无 - 默认 ""
# Hardcore.ItemRewards = ""

# 每次达成等级时奖励 ItemRewards 中物品的数量 - 默认 1
# Hardcore.ItemRewardAmount = 1

# 玩家达到该等级后挑战自动关闭。设为 0 表示永不自动关闭 - 默认 0
# Hardcore.DisableLevel = 0

# 达到指定等级时奖励成就。格式为"等级 成就ID"，多个用逗号分隔。留空表示无 - 默认 ""
# Hardcore.AchievementReward = ""

########################################
# ===== 半硬核 (SemiHardcore) =====
# 规则：玩家死亡后失去所有穿戴装备与携带金币。不可与硬核同时开启。
########################################

# 是否在选择器上提供「半硬核」挑战 - 默认 1
# SemiHardcore.Enable = 1

# 达到指定等级时奖励称号。格式为"等级 称号ID"，多个用逗号分隔。留空表示无 - 默认 ""
# SemiHardcore.TitleRewards = ""

# 启用该挑战时玩家获得经验的倍率（乘法叠加） - 默认 1
# SemiHardcore.XPMultiplier = 1

# 达到指定等级时奖励天赋点。格式为"等级 天赋点数"。留空表示无 - 默认 ""
# SemiHardcore.TalentRewards = ""

# 达到指定等级时奖励物品。格式为"等级 物品ID"。留空表示无 - 默认 ""
# SemiHardcore.ItemRewards = ""

# 每次达成等级时奖励 ItemRewards 中物品的数量 - 默认 1
# SemiHardcore.ItemRewardAmount = 1

# 玩家达到该等级后挑战自动关闭。设为 0 表示永不自动关闭 - 默认 0
# SemiHardcore.DisableLevel = 0

# 达到指定等级时奖励成就。格式为"等级 成就ID"。留空表示无 - 默认 ""
# SemiHardcore.AchievementReward = ""

########################################
# ===== 自造装备 (SelfCrafted) =====
# 规则：玩家只能穿戴自己亲手制作的装备。
########################################

# 是否在选择器上提供「自造装备」挑战 - 默认 1
# SelfCrafted.Enable = 1

# 达到指定等级时奖励称号。格式为"等级 称号ID"。留空表示无 - 默认 ""
# SelfCrafted.TitleRewards = ""

# 启用该挑战时玩家获得经验的倍率（乘法叠加） - 默认 1
# SelfCrafted.XPMultiplier = 1

# 达到指定等级时奖励天赋点。格式为"等级 天赋点数"。留空表示无 - 默认 ""
# SelfCrafted.TalentRewards = ""

# 达到指定等级时奖励物品。格式为"等级 物品ID"。留空表示无 - 默认 ""
# SelfCrafted.ItemRewards = ""

# 每次达成等级时奖励 ItemRewards 中物品的数量 - 默认 1
# SelfCrafted.ItemRewardAmount = 1

# 玩家达到该等级后挑战自动关闭。设为 0 表示永不自动关闭 - 默认 0
# SelfCrafted.DisableLevel = 0

# 达到指定等级时奖励成就。格式为"等级 成就ID"。留空表示无 - 默认 ""
# SelfCrafted.AchievementReward = ""

########################################
# ===== 物品品质等级 (ItemQualityLevel) =====
# 规则：玩家只能穿戴普通（白）或劣质（灰）品质的装备。
########################################

# 是否在选择器上提供「物品品质等级」挑战 - 默认 1
# ItemQualityLevel.Enable = 1

# 达到指定等级时奖励称号。格式为"等级 称号ID"。留空表示无 - 默认 ""
# ItemQualityLevel.TitleRewards = ""

# 启用该挑战时玩家获得经验的倍率（乘法叠加） - 默认 1
# ItemQualityLevel.XPMultiplier = 1

# 达到指定等级时奖励天赋点。格式为"等级 天赋点数"。留空表示无 - 默认 ""
# ItemQualityLevel.TalentRewards = ""

# 达到指定等级时奖励物品。格式为"等级 物品ID"。留空表示无 - 默认 ""
# ItemQualityLevel.ItemRewards = ""

# 每次达成等级时奖励 ItemRewards 中物品的数量 - 默认 1
# ItemQualityLevel.ItemRewardAmount = 1

# 玩家达到该等级后挑战自动关闭。设为 0 表示永不自动关闭 - 默认 0
# ItemQualityLevel.DisableLevel = 0

# 达到指定等级时奖励成就。格式为"等级 成就ID"。留空表示无 - 默认 ""
# ItemQualityLevel.AchievementReward = ""

########################################
# ===== 慢速经验 (SlowXpGain) =====
# 规则：玩家仅获得 0.5 倍正常经验。
########################################

# 是否在选择器上提供「慢速经验」挑战 - 默认 1
# SlowXpGain.Enable = 1

# 达到指定等级时奖励称号。格式为"等级 称号ID"。留空表示无 - 默认 ""
# SlowXpGain.TitleRewards = ""

# 达到指定等级时奖励天赋点。格式为"等级 天赋点数"。留空表示无 - 默认 ""
# SlowXpGain.TalentRewards = ""

# 达到指定等级时奖励物品。格式为"等级 物品ID"。留空表示无 - 默认 ""
# SlowXpGain.ItemRewards = ""

# 每次达成等级时奖励 ItemRewards 中物品的数量 - 默认 1
# SlowXpGain.ItemRewardAmount = 1

# 玩家达到该等级后挑战自动关闭。设为 0 表示永不自动关闭 - 默认 0
# SlowXpGain.DisableLevel = 0

# 启用该挑战时玩家获得经验的倍率（固定为 0.5 倍，此项不可调） - 默认 0.50
# SlowXpGain.XPMultiplier = 0.50

# 达到指定等级时奖励成就。格式为"等级 成就ID"。留空表示无 - 默认 ""
# SlowXpGain.AchievementReward = ""

########################################
# ===== 极慢经验 (VerySlowXpGain) =====
# 规则：玩家仅获得 0.25 倍正常经验，并同时享受慢速经验的所有奖励。
########################################

# 是否在选择器上提供「极慢经验」挑战 - 默认 1
