# =========================================
# mod-instant-swing 模组配置（瞬发打击）
# 用途：将“下次攻击触发”类技能改为瞬发（消耗公共冷却立即释放），受影响的技能包括：英勇打击、顺劈（战士）、挥击（德鲁伊）、符文打击（死亡骑士）。
# 说明：本文件所有设置均已注释，按需取消注释（去掉行首 # ）以启用。
# =========================================

# ===== 基础设置 =====

# 瞬发打击总开关：启用后技能立即释放（消耗 GCD），攻击计时不受打断，技能在正常自动攻击之外额外释放 - 默认 1（启用，0=禁用，使用 WotLK 原版行为）
# InstantSwing.Enable = 1
