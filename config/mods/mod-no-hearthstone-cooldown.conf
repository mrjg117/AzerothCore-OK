# =========================================
# mod-no-hearthstone-cooldown 模组配置（炉石无冷却）
# 用途：移除炉石的冷却时间，让玩家可随时使用炉石回城。
# 说明：本文件所有设置均已注释，按需取消注释（去掉行首 # ）以启用。
# =========================================

[worldserver]

# ===== 基础设置 =====

# 炉石无冷却总开关：启用后跳过炉石的冷却时间 - 默认 1（启用，0=禁用）
# NoHearthstoneCooldown.Enable = 1

# 登录时向玩家通告本模组已加载 - 默认 1（启用，0=禁用）
# NoHearthstoneCooldown.Announce = 1
