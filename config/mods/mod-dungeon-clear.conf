# ====================================================================
# mod-dungeon-clear 模组配置（中文注解版）
# 用途：让 playerbots 坦克机器人自动带 AI 队伍清副本（dungeon clear），
#       支持自动拉怪/清房/Boss 前暂停/脱战复活/智能休整/观战相机等。
# 说明：本文件所有设置项均已注释掉（# 前缀）。如需启用某项，请删除该行
#       前面的 “# ” 取消注释即可。原设置名与默认值完全不变。
#       运行期也可用 .dc on|off|status 或队伍聊天关键字控制，无需改配置。
#       带 .Heroic / .Raid 后缀的行见文件末尾“英雄本/团本默认值”分区。
# ====================================================================

# ===== 总开关与通用设置（玩家可在副本内用插件临时覆盖） =====

# 死亡机器人是否停留为尸体等待复活（1=副本/团本内死亡机器人不自动释放，便于跑尸/复活；0=恢复默认自动释放） - 默认 1
# DungeonClear.PreventBotRelease = 1

# 是否将每次 Boss 接战决策记录为 JSON 到 dungeonclear_decisions.jsonl（1=开启，用于离线回归测试；0=关闭，默认） - 默认 0
# DungeonClear.RecordDecisions = 0

# 拾取的最低物品品质（0=粗糙/灰，1=普通/白，2=精良/绿，3=稀有/蓝，4=史诗/紫；任务物品始终拾取，默认0=全捡） - 默认 0
# DungeonClear.LootMinQuality = 0

# 改进 playerbots 的自动队伍掷骰（1=开启：自操模式不代掷、会为未来可穿装备掷骰、立即掷骰；0=原始行为，默认） - 默认 0
# DungeonClear.BetterLootRolling = 0

# 清本时坦克是否忽略宝箱/地面物件（1=只停尸体、忽略宝箱，默认；0=顺路拾取可达宝箱） - 默认 1
# DungeonClear.IgnoreChests = 1

# 坦克被门挡住（点击/守门）多少秒后放弃并自动暂停本（秒，默认5） - 默认 5
# DungeonClear.DoorBlockedTimeout = 5

# ===== 休整与脱战恢复 =====

# 拉怪间隙队伍回血到的血量百分比（覆盖 playerbots 设置；0=继承默认，1-100=回血到此值，默认0） - 默认 0
# DungeonClear.RestHealthPct = 0

# 拉怪间隙队伍回蓝到的法力百分比（覆盖 playerbots 设置；0=继承默认，1-100=回蓝到此值，默认0） - 默认 0
# DungeonClear.RestManaPct = 0

# 智能休整（迟滞式）：低于触发线才整队歇至满状态（1=开启；0=关闭，默认） - 默认 0
# DungeonClear.SmartRest = 0

# 智能休整：任意队员血量低于此百分比触发整队休整（0=禁用该触发，默认50） - 默认 50
# DungeonClear.SmartRestHealthPct = 50

# 智能休整：DPS/坦克法力低于此百分比触发整队休整（0=禁用，默认10） - 默认 10
# DungeonClear.SmartRestDpsManaPct = 10

# 智能休整：治疗者法力低于此百分比触发整队休整（默认40） - 默认 40
# DungeonClear.SmartRestHealerManaPct = 40

# 脱战复活：队员死亡后若有人能复活则原地复活续跑（1=开启，默认；0=任何死亡立即结束本） - 默认 1
# DungeonClear.PostCombatRez = 1

# 脱战复活超时（秒）：脱战恢复超过此时间则放弃并结束本（默认90） - 默认 90
# DungeonClear.PostCombatRezTimeoutSecs = 90

# 卡死队员恢复：长时间无进度且队员卡出范围则传送回坦克（1=开启，默认；0=关闭） - 默认 1
# DungeonClear.StrandedRecovery = 1

# 卡死恢复判定：本无进度持续多少秒才传送卡死队员（秒，默认60） - 默认 60
# DungeonClear.StrandedRecoveryNoProgressSecs = 60

# 每个 Boss 前自动暂停等待手动继续（1=开启；0=关闭，默认） - 默认 0
# DungeonClear.WaitAtBoss = 0

# ===== 队伍走位与治疗重定位 =====

# 坦克可领先队员的最大距离（码）；超出则坦克停下等队伍（默认25.0） - 默认 25.0
# DungeonClear.PartyMaxSpread = 25.0

# 战斗中重新归位掉队队员（1=开启，默认；0=关闭，使用原始走位） - 默认 1
# DungeonClear.CombatRegroup = 1

# 硬外链距离（码）：队员漂移超过此距离无视贡献判定强行归位（默认40.0） - 默认 40.0
# DungeonClear.CombatRegroupDistance = 40.0

# 治疗者治疗距离中扣减的码数，用于预定位判定松弛（默认8.0） - 默认 8.0
# DungeonClear.CombatRegroupSlack = 8.0

# 战斗归位完成后重新就绪的冷却秒数（默认5.0） - 默认 5.0
# DungeonClear.CombatRegroupCooldown = 5.0

# 治疗者视线重定位修正（1=开启：治疗目标在无视线/超出范围时走位到有视线处再治疗；0=关闭，默认1） - 默认 1
# DungeonClear.HealReposition = 1

# 触发重定位的治疗目标血量上限百分比（默认90.0） - 默认 90.0
# DungeonClear.HealRepositionHpFloor = 90.0

# 选择追击目标时偏向坦克的健康度百分比（0=纯最低血量，默认15.0） - 默认 15.0
# DungeonClear.HealRepositionTankBias = 15.0

# 超过此距离（码）则不重定位，视为灭团/跳过（默认60.0） - 默认 60.0
# DungeonClear.HealRepositionMaxRange = 60.0

# ===== 仇恨范围与拉怪判定 =====

# 动态仇恨范围：依每个怪真实仇恨半径计算扫描带/Boss交战交接（1=开启，默认；0=使用固定距离） - 默认 1
# DungeonClear.DynamicAggroRange = 1

# Boss 交战交接距离在仇恨半径上的额外码数（仅动态模式，默认2.0） - 默认 2.0
# DungeonClear.AggroRangeMargin = 2.0

# 对开怪即拉全房的 Boss，先清房再拉（1=开启，默认；0=关闭） - 默认 1
# DungeonClear.ClearRoomBeforeBoss = 1

# 清房超时（秒）：清房无进展多久后放弃并直接拉 Boss（0=永不放弃，默认30） - 默认 30
# DungeonClear.RoomClearTimeout = 30

# 绕房仇恨 Boss 布线路径的额外码数（默认3.0） - 默认 3.0
# DungeonClear.RoomAggroPathPadding = 3.0

# 坦克绕房仇恨 Boss 时队伍与仇恨球的安全余量（码，默认10.0） - 默认 10.0
# DungeonClear.RoomAggroPartyMargin = 10.0

# 非战斗行进目标判定到达的半径（码，默认8.0） - 默认 8.0
# DungeonClear.ObjectiveArriveRadius = 8.0

# 副本事件单步超时（秒）：超时视为失败并跳过/卡住（默认30） - 默认 30
# DungeonClear.EventStepTimeout = 30

# Boss 交战交接距离下限（码，仅动态模式，默认12.0） - 默认 12.0
# DungeonClear.BossEngageRangeFloor = 12.0

# Boss 交战交接距离上限（码，仅动态模式，默认30.0） - 默认 30.0
# DungeonClear.BossEngageRangeCap = 30.0

# 小怪动态通道带宽度下限（码，仅动态模式，默认8.0） - 默认 8.0
