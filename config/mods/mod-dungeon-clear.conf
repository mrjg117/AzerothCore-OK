# 小怪动态通道带宽度上限（码，仅动态模式，默认30.0；英雄本42.0） - 默认 30.0
# DungeonClear.TrashWidthCap = 30.0

# ===== 调试日志（服务器专用，不可被玩家覆盖） =====

# 日志输出器：将 DungeonClear 频道写入独立文件（格式 类型,等级,标志,文件；2=文件，4=Info） - 默认 2,4,0,DungeonClear.log
