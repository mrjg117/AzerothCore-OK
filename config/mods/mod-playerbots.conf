# ===== 随机 Bot 生成 =====

# --- 随机机器人通用设置 ---

# 随机机器人账号是否使用随机生成密码 - 默认 0
# AiPlayerbot.RandomBotRandomPassword = 0

# 随机机器人最低等级 - 默认 1
# AiPlayerbot.RandomBotMinLevel = 1

# 随机机器人最高等级 - 默认 80
# AiPlayerbot.RandomBotMaxLevel = 80

# 随机机器人最高等级与在线玩家的服务器最高等级同步 - 默认 0
# AiPlayerbot.SyncLevelWithPlayers = 0

# 将大量 ≤ 机器人等级的任务标记为已完成（会拖慢机器人创建速度） - 默认 0
# AiPlayerbot.PreQuests = 0

# 允许随机机器人使用 LFG（寻找队伍） - 默认 1
# AiPlayerbot.RandomBotJoinLfg = 1

# 周期性让随机机器人上下线，模拟并非所有玩家同时在线（开启后从更大集合中随机抽取上下线） - 默认 0
# AiPlayerbot.EnablePeriodicOnlineOffline = 0

# 随机机器人总数（含离线）与当前在线数(MaxRandomBots)的比例（须>1.0，仅启用周期上下线时生效） - 默认 2.0
# AiPlayerbot.PeriodicOnlineOfflineRatio = 2.0

# 联盟随机机器人所占百分比 - 默认 50
# AiPlayerbot.RandomBotAllianceRatio = 50

# 部落随机机器人所占百分比 - 默认 50
# AiPlayerbot.RandomBotHordeRatio = 50

# 禁用死亡骑士机器人登录 - 默认 0
# AiPlayerbot.DisableDeathKnightLogin = 0

# 启用天赋/雕文按资料片的模拟限制（61级前限6排+第7排中间，61-70级限8排+第9排中间） - 默认 0
# AiPlayerbot.LimitTalentsExpansion = 0

# 随机机器人交易配置（0=禁用，1=启用，2=仅买，3=仅卖） - 默认 1
# AiPlayerbot.EnableRandomBotTrading = 1

# 交易动作中不被分析以打开交易窗口的消息前缀（逗号分隔） - 默认 "RPLL_H_,DBMv4,{звезда} Questie,{rt1} Questie"
# AiPlayerbot.TradeActionExcludedPrefixes = "RPLL_H_,DBMv4,{звезда} Questie,{rt1} Questie"

# 允许机器人发送邮件（关闭后不响应"send mail"等聊天指令寄送物品/金币） - 默认 1
# AiPlayerbot.BotSendMailEnabled = 1

# --- 随机机器人等级 ---

# 禁用随机等级（禁用后每个机器人从指定等级起步，但仍可杀怪/任务练级） - 默认 0
# AiPlayerbot.DisableRandomLevels = 0

# 若 DisableRandomLevels 启用，随机机器人起始等级 - 默认 1
# AiPlayerbot.RandombotStartingLevel = 1

# 首次随机化时机器人处于最低等级的概率（0-1，默认 0.1=10%） - 默认 0.1
# AiPlayerbot.RandomBotMinLevelChance = 0.1

# 首次随机化时机器人处于最高等级的概率（0-1，默认 0.1=10%） - 默认 0.1
# AiPlayerbot.RandomBotMaxLevelChance = 0.1

# 固定随机机器人等级（不再练级） - 默认 0
# AiPlayerbot.RandomBotFixedLevel = 0

# 将处于 RandomBotMaxLevel 的机器人降回 RandomBotMinLevel - 默认 0
# AiPlayerbot.DowngradeMaxLevelBot = 0

# 随机机器人经验倍率（实际经验 = 服务器经验率 × 此值） - 默认 1.0
# AiPlayerbot.RandomBotXPRate = 1.0

# --- 等级区间管理（Level Brackets） ---

# 启用等级区间功能：定期把随机机器人重新分配到各等级区间（按阵营分布） - 默认 0
# AiPlayerbot.LevelBrackets.Enabled = 0

# 等级分布检查执行频率（秒） - 默认 300
