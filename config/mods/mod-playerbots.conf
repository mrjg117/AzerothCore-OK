##################################################
# PLAYERBOTS 模组配置清单（中文注释版）          #
##################################################

# 概述
# 本文件为 AzerothCore 的 mod-playerbots（玩家机器人）模组配置清单。
# 所有"生效设置行"默认均已被注释（行首加 #）。需要启用某项时，只需删除该行行首的 "# "，
# 即可得到一条干净、可被服务端解析的 "Key = Value"。
# 每条设置上方的中文注释说明其用途，并标注「默认 X」。
#
# 术语：
#   Randombot（随机机器人）：系统自动生成并登入世界的机器人，会自行练级、任务、拾取、换装，可被邀请组队。
#   AddClass bot（加职业机器人）：通过 addclass 命令快速加入、已配好等级的机器人，适合快速组队。
#   Altbot（小号机器人）：玩家账号下创建的角色，可作为机器人被操控，适合长期养成。
# 控制机器人的命令见模组 Wiki：https://github.com/mod-playerbots/mod-playerbots/wiki/Playerbot-Commands

# ===== 总开关与全局 =====

# --- 模组总开关与随机机器人数量 ---

# 启用或禁用 Playerbots 模组（1=启用，0=禁用） - 默认 1
# AiPlayerbot.Enabled = 1

# 启用随机机器人系统（1=启用，0=禁用） - 默认 1
# AiPlayerbot.RandomBotAutologin = 1

# 随机机器人数量下限 / 上限（同时在线目标数量） - 默认 500 / 500
# AiPlayerbot.MinRandomBots = 500
# AiPlayerbot.MaxRandomBots = 500

# 随机机器人账号数量（0=按 MaxRandomBots、在线/离线比例与 AddClass 池自动计算；手动设为更大值可创建更多账号；若小于系统所需则被覆盖） - 默认 0（自动）
# AiPlayerbot.RandomBotAccountCount = 0

# 为 addclass 命令预留的账号数量（每个账号含 10 个/职业的机器人） - 默认 50
# AiPlayerbot.AddClassAccountPoolSize = 50

# 创建机器人账号的统一前缀（已有机器人账号时不要修改此前缀） - 默认 "rndbot"
# AiPlayerbot.RandomBotAccountPrefix = "rndbot"

# 删除所有随机机器人账号（设为 1 后启动服务端执行删除；删除后若要重建需设回 0 并重启服务端） - 默认 0（关闭）
# AiPlayerbot.DeleteRandomBotAccounts = 0

# 没有真实玩家在线时禁用随机机器人（1=启用；启用后真实玩家登录 30 秒后机器人上线，全部玩家离线 300 秒后机器人下线） - 默认 0（关闭，服务端启动即登录）
# AiPlayerbot.DisabledWithoutRealPlayer = 0

# 真实玩家登录后机器人延迟上线时间（秒） - 默认 30
# AiPlayerbot.DisabledWithoutRealPlayerLoginDelay = 30

# 全部真实玩家离线后机器人延迟下线时间（秒） - 默认 300
# AiPlayerbot.DisabledWithoutRealPlayerLogoutDelay = 300

# --- 玩家控制与组队权限 ---

# 玩家可同时控制的机器人最大数量 - 默认 40
# AiPlayerbot.MaxAddedBots = 40

# 是否允许 addclass 命令创建机器人（0=仅GM，1=允许） - 默认 1
# AiPlayerbot.AddClassCommand = 1

# 机器人接受组队邀请的权限等级（0=仅GM，1=按等级，2=总是接受） - 默认 1
# AiPlayerbot.GroupInvitationPermission = 1

# 队长离开后保留 altbot 在队伍中（1=保留不自动离队，0=默认行为自动离队） - 默认 0
# AiPlayerbot.KeepAltsInGroup = 0

# 玩家登录时自动将其所有小号作为 altbot 登录 - 默认 0
# AiPlayerbot.BotAutologin = 0

# 允许邀请同账号下的 altbot - 默认 1
# AiPlayerbot.AllowAccountBots = 1

# 允许邀请同公会内的 altbot - 默认 1
# AiPlayerbot.AllowGuildBots = 1

# 允许关联账号共享 altbot 控制 - 默认 1
# AiPlayerbot.AllowTrustedAccountBots = 1

# 随机机器人在附近创建公会（注：建公会后不会再邀请更多机器人入会） - 默认 0
# AiPlayerbot.RandomBotGuildNearby = 0

# 随机机器人创建的公会数量 - 默认 20
# AiPlayerbot.RandomBotGuildCount = 20

# 随机机器人公会最大成员数（最小硬编码为 10） - 默认 15
# AiPlayerbot.RandomBotGuildSizeMax = 15

# 设为 1 时删除所有随机机器人公会 - 默认 0
# AiPlayerbot.DeleteRandomBotGuilds = 0

# 随机机器人主动邀请玩家组队/副本/公会 - 默认 0
# AiPlayerbot.RandomBotInvitePlayer = 0

# 机器人邀请其他机器人时会在 say/公会 频道聊天 - 默认 0
# AiPlayerbot.InviteChat = 0

# 接受组队邀请时机器人自动被召唤到玩家身边 - 默认 1
# AiPlayerbot.SummonWhenGroup = 1

# 玩家可作为机器人（自 bot）的权限等级（0=禁用，1=仅GM(默认)，2=所有玩家，3=登录即激活） - 默认 1
# AiPlayerbot.SelfBotLevel = 1

# 非GM玩家仅能用 init=auto 按自身等级/装备分初始化机器人（0=可用任意初始化命令） - 默认 0
# AiPlayerbot.AutoInitOnly = 0

# 允许 .bot refresh=raid 为非加职业机器人解绑副本（0=拒绝，1=允许；解绑对数据库压力很小） - 默认 0
# AiPlayerbot.ResetInstanceIdForAltBots = 0

# init=auto 时机机器人装备等级上限比例（与玩家相同为 1.0） - 默认 1.0
# AiPlayerbot.AutoInitEquipLevelLimitRatio = 1.0

# 允许机器人学习训练师法术（只要有金币即可） - 默认 1
# AiPlayerbot.AllowLearnTrainerSpells = 1

# --- 召唤选项 ---

# 队长战斗中允许召唤机器人（1=允许，0=禁止） - 默认 1
# AiPlayerbot.AllowSummonInCombat = 1

# 队长死亡时允许召唤机器人（1=允许，0=禁止） - 默认 1
# AiPlayerbot.AllowSummonWhenMasterIsDead = 1

# 机器人死亡时允许召唤（0=仅鬼魂状态，1=总是） - 默认 1
# AiPlayerbot.AllowSummonWhenBotIsDead = 1

# 召唤时复活机器人（0=禁用，1=战斗中不复活，2=总是复活） - 默认 1
# AiPlayerbot.ReviveBotWhenSummoned = 1

# 召唤时机器人自动修理装备 - 默认 1
# AiPlayerbot.BotRepairWhenSummon = 1

# --- 坐骑使用等级 ---

# 机器人开始使用 60% 地面坐骑的最低等级（怀旧服：TBC=30，WLK=20，经典=40） - 默认 20
# AiPlayerbot.UseGroundMountAtMinLevel = 20

# 机器人开始使用 100% 快速地面坐骑的最低等级（经典=40，TBC=60） - 默认 40
# AiPlayerbot.UseFastGroundMountAtMinLevel = 40

# 机器人开始使用 150% 飞行坐骑的最低等级（TBC=70，WLK=60） - 默认 60
# AiPlayerbot.UseFlyMountAtMinLevel = 60

# 机器人开始使用 280% 快速飞行坐骑的最低等级（TBC/WLK=70） - 默认 70
# AiPlayerbot.UseFastFlyMountAtMinLevel = 70

# ===== 反应速度与 AI 节奏 =====

# --- AI 计时器（单位：毫秒 ms / 秒 s） ---

# 每个 AI tick 的最大迭代次数 - 默认 10
# AiPlayerbot.IterationsPerTick = 10

# 两次短 CD 法术施放之间的延迟（毫秒） - 默认 500
# AiPlayerbot.GlobalCooldown = 500

# 移动时的最大等待时间（毫秒） - 默认 5000
# AiPlayerbot.MaxWaitForMove = 5000

# 是否禁用 MoveSplinePath 移动（0=启用路径，1=仅战场/竞技场禁用，2=全局禁用；禁用后移动更不规则，但能使眩晕/定身/缠绕对机器人生效） - 默认 0
# AiPlayerbot.DisableMoveSplinePath = 0

# 移动搜索的最大耗时（值越大斜坡上移动越好） - 默认 3
# AiPlayerbot.MaxMovementSearchTime = 3

# 动作过期时间（毫秒） - 默认 5000
# AiPlayerbot.ExpireActionTime = 5000

# 驱散光环的最大持续时间（毫秒） - 默认 700
# AiPlayerbot.DispelAuraDuration = 700

# 两次机器人动作之间的反应延迟（毫秒；越小反应越快） - 默认 100
# AiPlayerbot.ReactDelay = 100

# 根据机器人不同状态动态调整反应延迟，以减少服务器卡顿 - 默认 1
# AiPlayerbot.DynamicReactDelay = 1

# 不活跃（被动）延迟（毫秒） - 默认 10000
# AiPlayerbot.PassiveDelay = 10000

# 重复动作（聊天消息、表情等）之间的最小延迟（毫秒） - 默认 2000
# AiPlayerbot.RepeatDelay = 2000

# 错误提示延迟（毫秒） - 默认 100
# AiPlayerbot.ErrorDelay = 100

# RPG 行为延迟（毫秒） - 默认 10000
# AiPlayerbot.RpgDelay = 10000

# 坐下休息延迟（毫秒） - 默认 20000
# AiPlayerbot.SitDelay = 20000

# 返回延迟（毫秒；注意最小值必须为 2000，更低会导致崩溃） - 默认 2000
# AiPlayerbot.ReturnDelay = 2000

# 拾取延迟（毫秒） - 默认 1000
# AiPlayerbot.LootDelay = 1000

# --- 飞行路径（坐飞行点）延迟（单位：毫秒 ms） ---

# 第一个跟随机器点击飞行管理员前的最小随机延迟（毫秒） - 默认 350
# AiPlayerbot.BotTaxiDelayMinMs = 350

# 飞行延迟窗口的上限（毫秒，值越大越能分散大规模团队起飞） - 默认 5000
# AiPlayerbot.BotTaxiDelayMaxMs = 5000

# 每个队伍槽位额外增加的固定间隔，避免机器人同时起飞（毫秒） - 默认 200
# AiPlayerbot.BotTaxiGapMs = 200

# 每个间隔额外的小随机抖动，使起飞看起来不那么机械（毫秒） - 默认 100
# AiPlayerbot.BotTaxiGapJitterMs = 100

# ===== 战斗行为 =====

# --- 副本/战斗策略 ---

# 进入副本时自动套用对应的副本战斗策略（若已实现） - 默认 1
# AiPlayerbot.ApplyInstanceStrategies = 1

# 启用自动躲避 AoE 策略 - 默认 1
# AiPlayerbot.AutoAvoidAoe = 1

# 仅躲避半径小于此值的 AoE 法术（码） - 默认 15.0
# AiPlayerbot.MaxAoeAvoidRadius = 15.0

# 不躲避的 AoE 法术 ID 白名单（逗号分隔） - 默认 50759,57491,13810,29946
# AiPlayerbot.AoeAvoidSpellWhitelist = 50759,57491,13810,29946

# 就绪检查（脱战）时，机器人先补缺失/将过期的增益再报告就绪 - 默认 0
# AiPlayerbot.ForceRebuffOnReadyCheck = 0

# 强制补增益时，光环剩余时间低于其满持续时间多少秒即予以补（秒） - 默认 60
# AiPlayerbot.ForceRebuffMarginSecs = 60

# 机器人可以逃离敌人（1=允许 flee） - 默认 1
# AiPlayerbot.FleeingEnabled = 1

# ===== 治疗与增益 =====

# --- 节省法力 / 祝福 / 团队增益 ---

# 启用治疗机器人"节省法力"策略 - 默认 1
# AiPlayerbot.AutoSaveMana = 1

# 治疗机器人节省法力的法力阈值（%，法力高于此值才正常治疗，低于则保留） - 默认 60
# AiPlayerbot.SaveManaThreshold = 60

# 圣骑士自动使用强效祝福（0=关闭，1=仅团队，2=所有队伍；具体祝福由队伍职业/天赋决定） - 默认 1
# AiPlayerbot.AutoGreaterBlessings = 1

# 自动使用团队试剂增益：野性赐福、奥术智慧、坚韧祷言、精神祷言、暗影防护祷言（0=关闭，1=仅团队，2=所有队伍） - 默认 2
# AiPlayerbot.AutoPartyBuffs = 2

# 机器人需用单目标版增益替代但因缺试剂而失败时，告知队伍 - 默认 1
# AiPlayerbot.TellWhenMissingBuffReagents = 1

# 缺试剂提示消息的冷却时间（秒，默认 300=5分钟） - 默认 300
# AiPlayerbot.MissingBuffReagentMessageCooldown = 300

# ===== 法力与资源（生命/法力阈值与作弊） =====

# --- 生命/法力百分比阈值（单位：%） ---

# 危急生命值百分比（低于此视为危急，优先自保/治疗） - 默认 25
# AiPlayerbot.CriticalHealth = 25

# 低生命值百分比 - 默认 45
# AiPlayerbot.LowHealth = 45

# 中等生命值百分比 - 默认 65
# AiPlayerbot.MediumHealth = 65

# 接近满血百分比 - 默认 85
# AiPlayerbot.AlmostFullHealth = 85

# 低法力百分比 - 默认 15
# AiPlayerbot.LowMana = 15

# 中等法力百分比 - 默认 40
# AiPlayerbot.MediumMana = 40

# 高法力百分比 - 默认 65
# AiPlayerbot.HighMana = 65

# --- 资源作弊（机器人可无偿拥有的资源） ---

# 为机器人启用的作弊项（可选：food 食物、health 生命、mana 法力、power 能量/怒气/符文、gold 金币、taxi 飞行、raid 副本相关；多项用逗号分隔；默认启用 food,taxi,raid） - 默认 "food,taxi,raid"
# AiPlayerbot.BotCheats = "food,taxi,raid"

# ===== 装备与拾取 =====

# --- 机器人外观与自动换装 ---

# 随机机器人是否显示头盔（0=全部隐藏，1=全部显示，2=随机化时随机） - 默认 1
# AiPlayerbot.RandomBotShowHelmet = 1

# 随机机器人是否显示披风（0=全部隐藏，1=全部显示，2=随机化时随机） - 默认 1
# AiPlayerbot.RandomBotShowCloak = 1

# altbot 自动装备背包中足够好的升级物品 - 默认 1
# AiPlayerbot.AutoEquipUpgradeLoot = 1

# 自动换装的品质阈值（新装备评分 ≥ 当前装备的该倍数时才换装） - 默认 1.1
# AiPlayerbot.EquipUpgradeThreshold = 1.1

# 两轮装备初始化，以生成更合适的装备（0=关，1=开） - 默认 0
# AiPlayerbot.TwoRoundsGearInit = 0

# --- 拾取规则 ---

# 拾取方式为"自由拾取"时机器人继续拾取 - 默认 0
# AiPlayerbot.FreeMethodLoot = 0

# 机器人对"需求"类物品的 roll 等级（0=跳过，1=贪婪，2=需求） - 默认 1
# AiPlayerbot.LootNeedRollLevel = 1

# 允许机器人对物品进行"贪婪" roll（全局开关；关闭则只需求或跳过） - 默认 0
# AiPlayerbot.LootGreedRollLevel = 0

# 允许机器人 roll 配方（可学会的专业配方则需求；不可学会的 BoE 配方在开启贪婪时贪婪） - 默认 0
# AiPlayerbot.LootRollRecipe = 0

# 附魔机器人用"分解"代替"贪婪" roll 可分解物品（关闭则贪婪） - 默认 0
# AiPlayerbot.LootRollDisenchant = 0

# 机器人不与之交互的 GameObject GUID 列表（逗号分隔，含任务物品与各类箱子） - 默认 见原值长列表
# AiPlayerbot.DisallowedGameObjects = 176213,17155,2656,74448,19020,3719,3658,3705,3706,105579,75293,2857,179490,141596,160836,160845,179516,176224,181085,176112,128308,128403,165739,165738,175245,175970,176325,176327,123329,2560

# --- 任务奖励 ---

# 机器人自动选择任务奖励（yes=选最有用的，no=列出全部，ask=选有用的并列出） - 默认 yes
# AiPlayerbot.AutoPickReward = yes

# 与玩家同步任务（你交任务时机器人立即完成对应任务，且不拾取任务物品） - 默认 1
# AiPlayerbot.SyncQuestWithPlayer = 1

# 替玩家交机器人任务时，自动完成玩家的任务 - 默认 0
# AiPlayerbot.SyncQuestForPlayer = 0

# 机器人丢弃过期（作废）任务 - 默认 1
# AiPlayerbot.DropObsoleteQuests = 1

# --- 维护命令（作弊式免费供给） ---

# 启用维护命令：学习全部可用法术/技能、分配天赋、补充消耗品、修理、附魔、插宝石等（需机器人等级高于 MinEnchantingBotLevel） - 默认 1
# AiPlayerbot.MaintenanceCommand = 1

# altbot 维护：免费提供弹药 - 默认 1
# AiPlayerbot.AltMaintenanceAmmo = 1

# altbot 维护：免费提供食物 - 默认 1
# AiPlayerbot.AltMaintenanceFood = 1

# altbot 维护：免费提供试剂 - 默认 1
# AiPlayerbot.AltMaintenanceReagents = 1

# altbot 维护：免费提供消耗品 - 默认 1
# AiPlayerbot.AltMaintenanceConsumables = 1

# altbot 维护：免费提供药水 - 默认 1
# AiPlayerbot.AltMaintenancePotions = 1

# altbot 维护：免费提供背包 - 默认 1
# AiPlayerbot.AltMaintenanceBags = 1

# altbot 维护：免费提供坐骑 - 默认 1
# AiPlayerbot.AltMaintenanceMounts = 1

# altbot 维护：免费提供技能等级 - 默认 1
# AiPlayerbot.AltMaintenanceSkills = 1

# altbot 维护：学习职业法术（含死亡骑士的死亡之门） - 默认 1
# AiPlayerbot.AltMaintenanceClassSpells = 1

# altbot 维护：学习可用法术 - 默认 1
# AiPlayerbot.AltMaintenanceAvailableSpells = 1

# altbot 维护：学习特殊法术（RandomBotSpellIds 列表中的法术及 DK 死亡之门） - 默认 1
# AiPlayerbot.AltMaintenanceSpecialSpells = 1

# altbot 维护：分配天赋树 - 默认 1
# AiPlayerbot.AltMaintenanceTalentTree = 1

# altbot 维护：安装雕文 - 默认 1
# AiPlayerbot.AltMaintenanceGlyphs = 1

# altbot 维护：插宝石与附魔 - 默认 1
# AiPlayerbot.AltMaintenanceGemsEnchants = 1

# altbot 维护：宠物相关 - 默认 1
# AiPlayerbot.AltMaintenancePet = 1

# altbot 维护：宠物天赋 - 默认 1
# AiPlayerbot.AltMaintenancePetTalents = 1

# altbot 维护：声望 - 默认 1
# AiPlayerbot.AltMaintenanceReputation = 1

# altbot 维护：门任务（attunement quests） - 默认 1
# AiPlayerbot.AltMaintenanceAttunementQuests = 1

# altbot 维护：钥匙环 - 默认 1
# AiPlayerbot.AltMaintenanceKeyring = 1

# --- 自动配装（autogear） ---

# 启用 autogear 命令（自动升级机器人装备，品质与装等等级受下面两项限制） - 默认 1
# AiPlayerbot.AutoGearCommand = 1

# 允许在 altbot 上使用 autogear 命令 - 默认 1
# AiPlayerbot.AutoGearCommandAltBots = 1

# 启用 autogear bis 命令（按 playerbots_bis_gear 表给毕业装；需 AutoGearQualityLimit=4 且 AutoGearCommand=1） - 默认 0
# AiPlayerbot.AutoGearBisCommand = 0

# autogear 装备品质上限（1=普通，2=优秀，3=精良，4=史诗，5=传说） - 默认 3
# AiPlayerbot.AutoGearQualityLimit = 3

# autogear 装备物品等级（iLVL）上限（0=无限制；可分经典/TBC/WLK 各阶段） - 默认 0
# AiPlayerbot.AutoGearScoreLimit = 0

# ===== 距离参数（单位：码 Yards） =====

# 远处距离（超出此距离不主动行动） - 默认 20.0
# AiPlayerbot.FarDistance = 20.0
# 视野距离 - 默认 100.0
# AiPlayerbot.SightDistance = 100.0
# 施法距离 - 默认 28.5
# AiPlayerbot.SpellDistance = 28.5
# 射击距离 - 默认 5.0
# AiPlayerbot.ShootDistance = 5.0
