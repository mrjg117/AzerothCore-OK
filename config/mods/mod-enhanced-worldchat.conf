# =========================================
# mod-enhanced-worldchat 模组配置（世界聊天增强 / WorldChat）
# 用途：提供跨阵营的世界频道、刷屏防护、重复消息检测、URL 过滤及交易/组队标签等功能。
# 说明：本文件所有设置均已注释，按需取消注释（去掉行首 # ）以启用。
# =========================================

# ===== 总开关 =====

# 世界聊天模组总开关 - 默认 1（启用，0=禁用）
# WorldChat.Enable = 1

# 允许跨阵营（联盟/部落）互相看到世界频道消息 - 默认 1（启用，0=禁用）
# WorldChat.CrossFaction = 1

# 登录时向玩家通告本模组已加载 - 默认 0（禁用，1=启用）
# WorldChat.Announce = 0

# ===== 频道与标识 =====

# 世界频道的名称 - 默认 "world"
# WorldChat.ChannelName = "world"

# 玩家登录后自动加入世界频道 - 默认 1（加入，0=不自动加入）
# WorldChat.OnLogin.State = 1

# 世界频道消息前缀标签 - 默认 "[World]"
# WorldChat.Tag = "[World]"

# 可使用世界频道的最低等级 - 默认 10（等级）
# WorldChat.MinimumLevel = 10

# 忽略系统/支持类消息（不被过滤或识别为广告） - 默认 1（启用，0=禁用）
# WorldChat.IgnoreSupport = 1

# ===== 刷屏防护（Flood） =====

# 刷屏检测时间窗口（秒）：在此窗口内的连续发言会被统计 - 默认 10（秒）
# WorldChat.Flood.WindowSeconds = 10

# 触发警告前允许的发言次数 - 默认 3（次）
# WorldChat.Flood.WarnCount = 3

# 触发禁言前允许的发言次数 - 默认 5（次）
# WorldChat.Flood.MuteCount = 5

# 触发禁言后的禁言时长 - 默认 60（秒）
# WorldChat.Flood.MuteSeconds = 60

# ===== 重复消息检测 =====

# 启用重复消息检测（拦截刷重复内容） - 默认 1（启用，0=禁用）
# WorldChat.DuplicateDetection = 1

# 重复检测的时间窗口（秒） - 默认 30（秒）
# WorldChat.Duplicate.WindowSeconds = 30

# 在时间窗口内允许的最大重复次数，超过则拦截 - 默认 2（次）
# WorldChat.Duplicate.MaxRepeats = 2

# ===== URL 过滤 =====

# 启用 URL 链接过滤 - 默认 1（启用，0=禁用）
# WorldChat.UrlFilter = 1

# 被屏蔽的 URL 关键词列表（逗号分隔），命中即拦截 - 默认 "http://,https://,www.,.com,.net,.org,discord.gg,bit.ly,tinyurl"
# WorldChat.UrlFilter.BlockedTerms = "http://,https://,www.,.com,.net,.org,discord.gg,bit.ly,tinyurl"

# ===== 交易 / 组队消息 =====

# 启用交易频道消息识别与标签 - 默认 1（启用，0=禁用）
# WorldChat.TradeDetection = 1

# 启用组队频道消息识别与标签 - 默认 1（启用，0=禁用）
# WorldChat.GroupDetection = 1

# 交易消息前缀标签 - 默认 "[Trade]"
# WorldChat.TradeTag = "[Trade]"

# 组队消息前缀标签 - 默认 "[Group]"
# WorldChat.GroupTag = "[Group]"
