# =========================================
# mod-low-level-rbg 模组配置（低级评级战场 / Low Level RBG）
# 用途：允许低等级玩家排队参加评级战场（RBG），并设置可排队的等级区间。
# 说明：本文件所有设置均已注释，按需取消注释（去掉行首 # ）以启用。
# =========================================

[worldserver]

# ===== 等级区间 =====

# 可排队参加 RBG 的最低等级 - 默认 10（等级）
# LowLevelRBG.MinLevelRBG = 10

# 可排队参加 RBG 的最高等级 - 默认 79（等级）
# LowLevelRBG.MaxLevelRBG = 79
