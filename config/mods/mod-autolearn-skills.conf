#
# mod-autolearn-skills —— 自动学习技能模组
# 用途：让角色自动学习适合其职业的武器技能、骑术与对应坐骑，省去手动学习。
# 下方所有设置均已被注释掉（以 # 开头），按需取消注释（去掉行首 # ）即可启用。
#

# ===== 总开关 =====

# 是否启用本模组。默认 1（启用）。0 = 关闭。
# AutoLearnSkills.Enable = 1

# ===== 武器 / 骑术总开关 =====

# 自动学习职业对应的武器技能。默认 1（启用）。0 = 关闭。
# AutoLearnSkills.AutoLearnWeaponSkills = 1

# 自动将已学习的武器技能升满。默认 1（启用）。0 = 关闭。
# AutoLearnSkills.MaxWeaponSkills = 1

# 自动学习骑术技能。默认 1（启用）。0 = 关闭。
# AutoLearnSkills.AutoLearnRiding = 1

# ===== 骑术等级与坐骑 =====

# 学习学徒级骑术（20 级）。默认 1（启用）。0 = 关闭。
# AutoLearnSkills.Riding.Apprentice = 1

# 学习学徒级骑术时，同时授予学徒级地面坐骑（20 级）。默认 1（授予）。0 = 不授予。
# AutoLearnSkills.Riding.GrantApprenticeMount = 1

# 学习技工级骑术（40 级）。默认 0（关闭）。1 = 启用。
# AutoLearnSkills.Riding.Journeyman = 0

# 学习技工级骑术时，同时授予技工级地面坐骑（40 级）。默认 0（不授予）。1 = 授予。
# AutoLearnSkills.Riding.GrantJourneymanMount = 0

# 学习专家级骑术，并授予专家级飞行坐骑（60 级）。默认 0（关闭）。1 = 启用。
# AutoLearnSkills.Riding.Expert = 0

# 学习专家级骑术时，同时授予专家级飞行坐骑（60 级）。默认 0（不授予）。1 = 授予。
# AutoLearnSkills.Riding.GrantExpertMount = 0

# 学习宗师级骑术，并授予宗师级飞行坐骑（70 级）。默认 0（关闭）。1 = 启用。
# AutoLearnSkills.Riding.Artisan = 0

# 学习宗师级骑术时，同时授予宗师级飞行坐骑（70 级）。默认 0（不授予）。1 = 授予。
# AutoLearnSkills.Riding.GrantArtisanMount = 0

# 自动学习寒冷天气飞行骑术（77 级）。默认 0（关闭）。1 = 启用。
# AutoLearnSkills.Riding.ColdWeather = 0
