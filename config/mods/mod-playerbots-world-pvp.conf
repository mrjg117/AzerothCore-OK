#
# mod-playerbots-world-pvp（玩家机器人世界 PvP 模组）
# 用途：自动发起简单的世界 PvP 热点事件——进攻方在城外集结后突入目标城镇/区域，防守方在
#       防御点生成，事件随后平息；并支持真实玩家带队时唤醒对立阵营机器人防御。以下设置默认
#       全部注释，按需取消注释进行调整。
#

[worldserver]

#################################
# ===== 总开关与调试 =====
#################################

# 是否启用世界 PvP 模组（1=启用，0=禁用） - 默认 1
# PlayerbotWorldPvp.Enable = 1

# 是否输出调试信息（1=开启调试，0=关闭） - 默认 1
# PlayerbotWorldPvp.Debug = 1

#################################
# ===== 事件触发频率 =====
#################################

# 模组每隔多少秒进行一次随机世界 PvP 事件的判定 - 默认 60
# PlayerbotWorldPvp.TickSeconds = 60

# 每次判定触发事件的概率（百分比） - 默认 20
# PlayerbotWorldPvp.EventChancePerTick = 20

# 同时处于活动状态的事件最大数量 - 默认 2
# PlayerbotWorldPvp.MaxActiveEvents = 2

# 服务器启动后多少秒才开始首次事件判定（启动延迟） - 默认 120
# PlayerbotWorldPvp.StartupDelaySeconds = 120

#################################
# ===== 机器人资格筛选 =====
#################################
# 安全限制：只移动随机玩家机器人账号。BotAccountPrefix 默认自动读取 AiPlayerbot.RandomBotAccountPrefix（通常为 ashrandbot）。

# 仅允许随机玩家机器人账号参与（1=仅随机机器人，0=不限） - 默认 1
# PlayerbotWorldPvp.BotOnlyEligibilityFilter = 1

# 是否使用 playerbot 配置（1=使用，0=不使用） - 默认 1
# PlayerbotWorldPvp.UsePlayerbotConfig = 1

# 机器人账号前缀（auto=自动从 playerbot 配置读取） - 默认 auto
# PlayerbotWorldPvp.BotAccountPrefix = auto

# 参与机器人账号 ID 最小值（0=不限制下限） - 默认 0
# PlayerbotWorldPvp.BotAccountMin = 0

# 参与机器人账号 ID 最大值（0=不限制上限） - 默认 0
# PlayerbotWorldPvp.BotAccountMax = 0

#################################
# ===== 移动模型 =====
#################################
# 进攻方传送到城外/集结点到目标点；仅当机器人拒绝移动时再把 HardTeleportToTarget 设为 1。

# 是否将机器人传送到集结/城外点（1=传送，0=不传送） - 默认 1
# PlayerbotWorldPvp.TeleportBots = 1

# 事件结束后是否将机器人送回原处（1=送回，0=不送回） - 默认 1
# PlayerbotWorldPvp.ReturnBotsAfterEvent = 1

# 集结后是否使用 MovePoint 走向目标（1=走向，0=传送到目标） - 默认 1
# PlayerbotWorldPvp.UseMovePointAfterRally = 1

# 是否直接将机器人硬传送到目标点（仅当机器人拒绝移动时设为 1） - 默认 0
# PlayerbotWorldPvp.HardTeleportToTarget = 0

# 集结后延迟多少秒再开始向目标移动 - 默认 15
# PlayerbotWorldPvp.MoveFromRallyDelaySeconds = 15

# 目标点周围的随机位置抖动范围（码），避免机器人完全重叠 - 默认 8
# PlayerbotWorldPvp.PositionJitter = 8

#################################
# ===== 候选池 =====
#################################
# GlobalMinLevel 对各热点统一设下限，避免低等级机器人被拉入世界 PvP。

# 参与机器人的全局最低等级（各热点均受此钳制） - 默认 20
# PlayerbotWorldPvp.GlobalMinLevel = 20

# 单次查询机器人候选池的数量上限 - 默认 600
# PlayerbotWorldPvp.BotQueryLimit = 600

# 触发事件所需的最低在线机器人数量 - 默认 3
# PlayerbotWorldPvp.MinOnlineBotsRequired = 3

# 每方机器人最大数量（当前服务器 20+ 人口较少，初期宜保持较小） - 默认 8
# PlayerbotWorldPvp.MaxBotsPerSide = 8

#################################
# ===== 反应式阵营防御 =====
#################################
# 真实玩家带队的户外团本会唤醒对立阵营的 60 级随机机器人，在其推进前于 120 码外列阵。
# 真实队长必须开启 PvP 标记；绝不创建、强化或改写角色。

# 是否启用反应式阵营防御（1=启用，0=禁用） - 默认 1
# PlayerbotWorldPvp.ReactiveRaidResponse.Enable = 1

# 触发防御所需真实玩家带队的最小队伍规模 - 默认 20
# PlayerbotWorldPvp.ReactiveRaidResponse.MinGroupSize = 20

# 响应防御的机器人最大数量 - 默认 40
# PlayerbotWorldPvp.ReactiveRaidResponse.MaxResponders = 40

# 响应机器人登录延迟（秒） - 默认 20
# PlayerbotWorldPvp.ReactiveRaidResponse.LoginDelaySeconds = 20

# 两次反应式防御之间的冷却时间（秒） - 默认 1800
# PlayerbotWorldPvp.ReactiveRaidResponse.CooldownSeconds = 1800

# 响应防御持续时间（分钟） - 默认 20
# PlayerbotWorldPvp.ReactiveRaidResponse.DurationMinutes = 20

#################################
# ===== 审计日志 =====
#################################

# 是否将事件写入日志文件（1=写入，0=不写） - 默认 1
# PlayerbotWorldPvp.FileLog = 1

# 日志文件保存路径 - 默认 Logs/playerbot_world_pvp.log
# PlayerbotWorldPvp.FileLogPath = Logs/playerbot_world_pvp.log

#################################
# ===== 同阵营决斗练习 =====
#################################
# 同阵营热点（如 StormwindDuel、OrgrimmarDuel）将机器人两两配对并施放决斗法术。

# 是否启用同阵营决斗练习（1=启用，0=禁用） - 默认 1
# PlayerbotWorldPvp.SameFactionDuels = 1

# 发出决斗请求前的延迟（秒） - 默认 8
# PlayerbotWorldPvp.DuelRequestDelaySeconds = 8

# 决斗所用法术 ID - 默认 7266
# PlayerbotWorldPvp.DuelSpellId = 7266

# 决斗配对的最大数量 - 默认 8
# PlayerbotWorldPvp.DuelPairLimit = 8

#################################
# ===== 玩家机器人 AI 集成 =====
#################################
# 事件期间强制机器人使用 playerbot 的 pvp 与 duel 策略。

# 是否强制启用玩家机器人 AI 策略（1=启用，0=禁用） - 默认 1
# PlayerbotWorldPvp.EnablePlayerbotAiStrategies = 1

# 是否强制开启机器人 PvP 标记（1=强制，0=不强制） - 默认 1
# PlayerbotWorldPvp.ForcePvpFlag = 1

# 交战瞬间是否强制攻击（1=强制，0=不强制） - 默认 1
# PlayerbotWorldPvp.ForceAttackOnEngage = 1

# 移动到目标后多少秒开始交战 - 默认 4
# PlayerbotWorldPvp.EngageAfterMoveSeconds = 4

# 交战失败后重试间隔（秒） - 默认 5
# PlayerbotWorldPvp.EngageRetrySeconds = 5

# 交战最大重试次数 - 默认 12
# PlayerbotWorldPvp.EngageMaxRetries = 12

# 战斗时的 PvP 策略组合（+增加/-移除） - 默认 +pvp,+boost,+dps debuff,-passive,-stay
# PlayerbotWorldPvp.PvpCombatStrategies = +pvp,+boost,+dps debuff,-passive,-stay

# 非战斗时的 PvP 策略组合（+增加/-移除） - 默认 +pvp,+duel,+boost,-passive,-stay
# PlayerbotWorldPvp.PvpNonCombatStrategies = +pvp,+duel,+boost,-passive,-stay
