# =========================================
# mod-aoe-loot 模组配置（范围拾取 / AoE Loot）
# 用途：允许玩家一次性范围拾取附近尸体/容器中的战利品。
# 说明：本文件所有设置均已注释，按需取消注释（去掉行首 # ）以启用。
# =========================================

# ===== 基础设置 =====

# 模组总开关 - 默认 1（启用，0=禁用）
# AOELoot.Enable = 1

# 拾取时显示范围拾取提示消息 - 默认 1（启用，0=禁用）
# AOELoot.Message = 1

# ===== 拾取范围 =====

# 范围拾取的最大搜索距离（码） - 默认 55.0（有效范围 5.0 - 100.0）
# AOELoot.Range = 55.0

# ===== 组队行为 =====

# 玩家处于队伍中时启用范围拾取 - 默认 1（启用，0=禁用）
# AOELoot.Group = 1
