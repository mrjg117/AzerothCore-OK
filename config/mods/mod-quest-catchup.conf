#
# mod-quest-catchup —— 任务追赶模组
# 用途：提供命令让玩家一键补做 / 补全符合条件的任务并领取奖励，帮助新玩家或回归玩家追赶进度。
# 下方所有设置均已被注释掉（以 # 开头），按需取消注释（去掉行首 # ）即可启用。
#

# ===== 总开关与模式 =====

# 是否启用任务追赶模组。0 = 关闭（命令不可用）；1 = 启用。默认 1。
# QuestCatchup.Enabled = 1

# 试运行模式：是否只预览符合条件的任务而不实际提交改动。0 = 正式模式（完成任务并发放奖励）；1 = 试运行模式（仅列出符合条件的任务）。默认 0。
# QuestCatchup.DryRun = 0

# 记录已完成任务：是否将已完成的任务记录到控制台。0 = 关闭；1 = 启用。默认 1。
# QuestCatchup.LogCompleted = 1

# ===== 日志 =====

# 日志级别：设为 4（debug）或 5（trace）可查看详细输出。
# 示例：Logger.QuestCatchup=4,Console Server
# 0 = 关闭，1 = 错误，2 = 警告，3 = 信息，4 = 调试，5 = 跟踪
# （注：该项为 AzerothCore 标准 Logger 配置，不在本模组 conf 中以 Key=Value 形式提供，需按示例自行添加到 worldserver.conf。）
