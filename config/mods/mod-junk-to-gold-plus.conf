# =========================================
# mod-junk-to-gold-plus 模组配置（垃圾自动变现）
# 用途：自动出售背包中的垃圾（灰色）物品换金币，并可选择性地提示出售信息。
# 说明：本文件所有设置均已注释，按需取消注释（去掉行首 # ）以启用。
# =========================================

# ===== 基础设置 =====

# 模组总开关：自动出售垃圾物品 - 默认 1（启用，0=禁用）
# JunkToGoldPlus.Enable = 1

# 自动售出物品时在聊天中显示提示消息 - 默认 1（启用，0=禁用）；仅当 Enable=1 时生效
# JunkToGoldPlus.EnableSaleChat = 1
