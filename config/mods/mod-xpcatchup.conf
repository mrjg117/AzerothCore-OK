# =========================================
# mod-xpcatchup 模组配置（经验追赶 / XP Catch-Up）
# 用途：动态地将击杀经验重新分配给队伍/团队中低等级成员，使其在可配置等级差窗口内追上当前最高等级成员。
# 说明：本文件所有设置均已注释，按需取消注释（去掉行首 # ）以启用。
# =========================================

# ===== 基础设置 =====

# 模组总开关：启用经验追赶系统 - 默认 true（启用，false=禁用）
# XPCatchup.Enable = true

# ===== 分配规则 =====

# 等级差窗口：与当前击杀最高等级合格成员的等级差超过此值的成员，不参与经验重分配 - 默认 7（推荐值，对应 WotLK 队伍经验共享有效范围）
# XPCatchup.LevelWindow = 7

# 分配算法：0=最低优先（整个经验池给经验最低的单名成员，默认），1=动态（按经验缺口加权比例分摊，适合多名不同等级角色同时追赶） - 默认 0
# XPCatchup.Distribution = 0

# 注意：追赶激活阈值（百分比）在原 .conf.dist 中仅有说明、未提供独立设置项。
# 其行为为：当至少一名成员相对最高等级成员的缺口达到该百分比时才激活（默认 10%）；设为 0 则无论缺口多少始终激活。
# 当前模组以内部默认值 10% 处理，无需（也无对应键）手动配置。

# ===== 兼容性与调试 =====

# 已废弃的兼容选项：追赶现已对玩家与机器人同样生效，并以每次击杀的最高等级合格成员为参照而非队长。当前被忽略，仅为向后兼容保留 - 默认 true
# XPCatchup.RequireRealMaster = true

# 聊天调试模式：每次击杀后向队伍聊天发送各角色获得经验的信息（如“[XP Catch-Up] received 840 XP...”）。繁忙副本中非常刷屏，仅用于验证/调试 - 默认 false（禁用，true=启用）
# XPCatchup.ChatDebug = false

# 调试日志：向控制台与 Server.log 输出 LOG_INFO 日志（需在 worldserver.conf 中将对应 logger 级别设为 4，如 Logger.XPCatchup=4,Console Server）。繁忙副本中非常刷屏，仅用于验证/调试 - 默认 false（禁用，true=启用）
# XPCatchup.Logging = false
