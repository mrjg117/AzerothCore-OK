# =========================================
# mod-quest-loot-party 模组配置（任务战利品共享）
# 用途：将任务奖励/战利品在队伍成员间共享或发送提示消息。
# 说明：本文件所有设置均已注释，按需取消注释（去掉行首 # ）以启用。
# =========================================

[worldserver]

# ===== 基础设置 =====

# 模组总开关：启用任务战利品共享功能 - 默认 true（启用，false=禁用）
# QuestParty.Enable = true

# 启用任务战利品共享的提示消息 - 默认 true（启用，false=禁用）
# QuestParty.Message = true
