#
# mod-rndbot-buffs —— 随机机器人增益模组
# 用途：让附近的随机玩家机器人（rndbot）自动为玩家施放友善的增益法术（如耐力、智力、野性标记等）。
# 下方所有设置均已被注释掉（以 # 开头），按需取消注释（去掉行首 # ）即可启用。
#

# ===== 总开关 =====

# 是否启用随机机器人附近玩家增益功能。默认 1（启用）。0 = 关闭。
# RndbotBuffs.Enable = 1

# ===== 行为与触发 =====

# 检查间隔：每个 rndbot 每隔多少毫秒寻找一个可增益的玩家。每次检查最多施放一个增益。最小值 1000，默认 5000（毫秒）。
# RndbotBuffs.CheckIntervalMs = 5000

# 搜索半径：最大搜索范围（单位：码）。范围 5-100，默认 30。
# RndbotBuffs.Radius = 30

# 最低法力百分比：法力低于该百分比时不进行友善增益（PlayerbotAI 仍会执行正常的法术消耗检查）。范围 0-100，默认 35。
# RndbotBuffs.MinimumManaPct = 35

# 仅同阵营：是否只增益与 rndbot 同阵营的玩家。默认 1（是）。0 = 否。
# RndbotBuffs.SameFactionOnly = 1

# 跳过战斗中的玩家：避免增益正在战斗的玩家，也防止 rndbot 因协助他们而被拉入战斗。默认 1（跳过）。0 = 不跳过。
# RndbotBuffs.SkipPlayersInCombat = 1

# 跳过战场与竞技场：在战场和竞技场中禁用友善增益。默认 1（禁用）。0 = 不禁用。
# RndbotBuffs.SkipBattlegrounds = 1

# ===== 职业增益 =====

# 启用各职业支持的增益法术组合：
# 牧师：真言术：韧、神圣之灵、暗影防护
# 法师：奥术智慧
# 德鲁伊：野性印记、荆棘术
# 圣骑士：王者祝福，或按职责对应的智慧 / 力量祝福
# 默认均为 1（启用）。

# 牧师增益组合开关。默认 1（启用）。0 = 关闭。
# RndbotBuffs.Classes.Priest = 1

# 法师增益组合开关。默认 1（启用）。0 = 关闭。
# RndbotBuffs.Classes.Mage = 1

# 德鲁伊增益组合开关。默认 1（启用）。0 = 关闭。
# RndbotBuffs.Classes.Druid = 1

# 圣骑士增益组合开关。默认 1（启用）。0 = 关闭。
# RndbotBuffs.Classes.Paladin = 1

# ===== 日志 =====

# 调试日志：是否将成功施放的友善增益记录到 playerbots 调试日志。默认 0（关闭）。1 = 开启。
# RndbotBuffs.Debug = 0
