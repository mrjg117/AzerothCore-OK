#
# mod-dynamic-gathering-speed —— 动态采集速度模组
# 用途：按采集技能等级分别调整采矿 / 采药 / 剥皮的施法速度（倍率）。
# 下方所有设置均已被注释掉（以 # 开头），按需取消注释（去掉行首 # ）即可启用。
# 作者：silviu20092
#

# [worldserver]  # 配置段标识：以下设置属于 worldserver 配置段

# ===== 总开关 =====

# 模组主开关：是否启用动态采集速度功能。默认 1（启用）。0 = 关闭。
# DynamicGatheringSpeed.Enable = 1

# 调试日志：是否输出根据倍率改变施法时间的详细日志。默认 0（关闭）。1 = 开启。
# DynamicGatheringSpeed.DebugLog = 0

# ===== 采矿速率（倍率）=====
# 倍率通用说明：2 = 2 倍速；1.3 = 1.3 倍速；1 = 不变（默认）；0 = 瞬间采集（无施法动画，立即拾取）；0.3 = 0.3 倍（实际更慢，施法时间更长）。

# 采矿 - 学徒级 采集速率倍率。默认 1。
# DynamicGatheringSpeed.Mining.Apprentice.Rate = 1

# 采矿 - 技工级 采集速率倍率。默认 1。
# DynamicGatheringSpeed.Mining.Journeyman.Rate = 1

# 采矿 - 专家级 采集速率倍率。默认 1。
# DynamicGatheringSpeed.Mining.Expert.Rate = 1

# 采矿 - 大师级 采集速率倍率。默认 1。
# DynamicGatheringSpeed.Mining.Artisan.Rate = 1

# 采矿 - 宗师级 采集速率倍率。默认 1。
# DynamicGatheringSpeed.Mining.Master.Rate = 1

# 采矿 - 大导师级 采集速率倍率。默认 1。
# DynamicGatheringSpeed.Mining.GrandMaster.Rate = 1

# ===== 采药速率（倍率）=====
# 倍率通用说明同采矿：2 倍速 / 1.3 / 1 不变 / 0 瞬间 / 0.3 更慢。

# 采药 - 学徒级 采集速率倍率。默认 1。
# DynamicGatheringSpeed.Herbalism.Apprentice.Rate = 1

# 采药 - 技工级 采集速率倍率。默认 1。
# DynamicGatheringSpeed.Herbalism.Journeyman.Rate = 1

# 采药 - 专家级 采集速率倍率。默认 1。
# DynamicGatheringSpeed.Herbalism.Expert.Rate = 1

# 采药 - 大师级 采集速率倍率。默认 1。
# DynamicGatheringSpeed.Herbalism.Artisan.Rate = 1

# 采药 - 宗师级 采集速率倍率。默认 1。
# DynamicGatheringSpeed.Herbalism.Master.Rate = 1

# 采药 - 大导师级 采集速率倍率。默认 1。
# DynamicGatheringSpeed.Herbalism.GrandMaster.Rate = 1

# ===== 剥皮速率（倍率）=====
# 倍率通用说明同采矿：2 倍速 / 1.3 / 1 不变 / 0 瞬间 / 0.3 更慢。

# 剥皮 - 学徒级 采集速率倍率。默认 1。
# DynamicGatheringSpeed.Skinning.Apprentice.Rate = 1

# 剥皮 - 技工级 采集速率倍率。默认 1。
# DynamicGatheringSpeed.Skinning.Journeyman.Rate = 1

# 剥皮 - 专家级 采集速率倍率。默认 1。
# DynamicGatheringSpeed.Skinning.Expert.Rate = 1

# 剥皮 - 大师级 采集速率倍率。默认 1。
# DynamicGatheringSpeed.Skinning.Artisan.Rate = 1

# 剥皮 - 宗师级 采集速率倍率。默认 1。
# DynamicGatheringSpeed.Skinning.Master.Rate = 1

# 剥皮 - 大导师级 采集速率倍率。默认 1。
# DynamicGatheringSpeed.Skinning.GrandMaster.Rate = 1
