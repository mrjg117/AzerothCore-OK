#
# mod-guild-levels —— 公会等级模组
# 用途：为公会加入经验、等级以及借鉴《大地的裂变》(Cata) 的公会特权（perk），如资金流、移动银行、群体复活等。
# 使用方法：将此文件复制为 guild_levels.conf，放在 worldserver.conf 同目录，并在 worldserver.conf 中引用。
# 下方所有设置均已被注释掉（以 # 开头），按需取消注释（去掉行首 # ）即可启用。
#

# ===== 总开关与同步 =====

# 是否启用公会等级模组。默认 1（启用）。0 = 关闭。
# GuildLevels.Enable = 1

# 插件同步：是否通过偷偷语 LANG_ADDON 数据包，把进度推送到 GuildLevels 客户端插件。默认 1（启用）。0 = 关闭。
# GuildLevels.AddonSync = 1

# ===== 公会经验 =====

# 击杀经验转化比例：玩家击杀获得的经验（击杀途径）转化为公会经验的比例。默认 0.08（8%）。
# GuildLevels.XpFromKillPlayerXpPct = 0.08

# 任务经验转化比例：任务 / 巨龙之魂任务经验中作为公会经验授予的比例。默认 0.06（6%）。
# GuildLevels.XpFromQuestPlayerXpPct = 0.06

# 探索固定经验：每次探索发现地点给予的公会固定经验值。默认 35。
# GuildLevels.XpExploreFlat = 35

# 击杀奖励固定经验：每次击杀荣誉生物额外给予的公会固定经验值（在击杀经验分成之外）。默认 8。
# GuildLevels.XpKillBonusFlat = 8

# 每日公会经验上限（0 = 无限制）。默认 6200000。
# GuildLevels.DailyXpCap = 6200000

# 每周公会经验上限（0 = 无限制）。默认 0（无上限）。
# GuildLevels.WeeklyXpCap = 0

# ===== 资金流（Cash Flow）=====

# 资金流一级比例：从拾取的敌人金钱中存入公会银行的比例（rank 1）。默认 0.05（5%）。
# GuildLevels.CashFlowLootPct1 = 0.05

# 资金流二级比例：从拾取的敌人金钱中存入公会银行的比例（rank 2）。默认 0.10（10%）。
# GuildLevels.CashFlowLootPct2 = 0.10

# ===== 特权技能 / 法术 =====

# 坐骑速度特权：登录时若在符合条件的公会中，对其施放的法术 ID（0 = 关闭）。默认 80000011（由模组自带 SQL 提供）。
# GuildLevels.MountSpeedSpellId = 80000011

# 移动银行法术 ID：解锁后临时授予移动银行能力。默认 80000012。
# GuildLevels.MobileBankingSpellId = 80000012

# 群体复活法术 ID：解锁后临时授予群体复活能力。默认 80000013。
# GuildLevels.MassResurrectionSpellId = 80000013

# 移动银行游戏对象 ID：在施法者附近召唤的临时公会银行物体。默认 80000020。
# GuildLevels.MobileBankingGameObjectEntry = 80000020

# 移动银行持续时间：临时公会银行存在的时长（毫秒）。默认 60000（60 秒）。
# GuildLevels.MobileBankingDurationMs = 60000
