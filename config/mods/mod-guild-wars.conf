###############################################################################
# mod-guild-wars —— 公会战争模组
# 用途：为服务器添加公会之间的领土战争系统（占领区域、击杀竞赛、区域税收等）。
# 下方所有设置均已被注释掉（以 # 开头），按需取消注释（去掉行首 # ）即可启用。
###############################################################################

# ===== 总开关 =====

# 是否启用公会战争模组。默认 1（启用）。0 = 关闭。
# GuildWars.Enable = 1

# ===== 战争机制 =====

# 单场战争窗口持续多少秒，到达后按击杀数自动结算。默认 3600（1 小时）。
# GuildWars.WarDurationSecs = 3600

# 某一方需要达到多少 PvP 击杀数才能瞬间获胜。0 = 关闭击杀阈值，仅按计时器结算。默认 20。
# GuildWars.KillThreshold = 20

# 服务器多久（秒）检查一次区域税收与活跃度要求。默认 3600（1 小时）。
# GuildWars.MaintenanceIntervalSecs = 3600

# 防守方在宣战过期前有多少秒可以接受宣战。默认 86400（24 小时）。
# GuildWars.WarAcceptTimeoutSecs = 86400

# 同一区域两场战争之间的最小间隔秒数。默认 86400（24 小时）。
# GuildWars.WarCooldownSecs = 86400

# ===== Playerbot（玩家机器人）集成 =====

# 当存在 mod-playerbots 时，是否自动把公会机器人招募进区域战争。默认 1（启用）。0 = 关闭。
# GuildWars.EnablePlayerbotParticipation = 1

# 每场战斗中每个公会最多招募的机器人数量。默认 10。
# GuildWars.MaxBotsPerSide = 10

# 机器人在线时长是否计入公会活跃度要求。默认 0（关闭，防止机器人刷活跃度）。
# GuildWars.CountBotActivityMinutes = 0

# 是否允许纯机器人公会购买区域或宣战。默认 0（关闭）。1 = 允许。
# GuildWars.AllowBotOnlyGuildCapture = 0
