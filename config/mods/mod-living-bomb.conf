# =========================================
# mod-living-bomb 模组配置（活体炸弹 / Living Bomb）
# 用途：将法师“活体炸弹”改为《熊猫人之谜》(MoP) 风格的行为。
# 说明：本文件所有设置均已注释，按需取消注释（去掉行首 # ）以启用。
# =========================================

[worldserver]

# ===== 基础行为 =====

# 启用 MoP 风格活体炸弹行为（关闭则使用 WotLK 原版行为） - 默认 1（启用，0=禁用）
# LivingBomb.MoP.Enable = 1

# 目标死亡时引爆活体炸弹 - 默认 1（启用，0=禁用，使用 WotLK 行为）
# LivingBomb.MoP.ExplodeOnDeath = 1

# 爆炸同时伤害携带炸弹的目标本身 - 默认 1（启用，0=禁用，使用 WotLK 行为）
# LivingBomb.MoP.DamagePrimaryTarget = 1

# 允许同时对多个目标施放活体炸弹 - 默认 1（启用，0=禁用，使用 WotLK 单目标限制）
# LivingBomb.MoP.AllowMultiTarget = 1

# ===== 日志 =====

# 启用详细日志（在服务器日志中输出 LB-DEBUG 行） - 默认 0（禁用，1=启用）
# LivingBomb.MoP.Debug = 0
