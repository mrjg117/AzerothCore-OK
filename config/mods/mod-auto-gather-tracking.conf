# =========================================
# mod-auto-gather-tracking 模组配置（自动采集追踪）
# 用途：拥有草药学或采矿的玩家自动在小地图显示附近的草药/矿点，无需手动保持“寻找草药/矿石”。
# 说明：本文件所有设置均已注释，按需取消注释（去掉行首 # ）以启用。
# =========================================

# ===== 基础设置 =====

# 自动采集追踪总开关：自动追踪已学采集专业对应的草药/矿点 - 默认 1（启用，0=禁用，使用常规小地图追踪）
# AutoGatherTracking.Enable = 1
