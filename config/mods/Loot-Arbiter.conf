# =====================================================================
# Loot-Arbiter（纯 Lua 脚本模组）
# =====================================================================
# 本模组为纯服务端 Lua 脚本，没有独立的 .conf.dist 服务端配置文件。
# 所有行为通过以下方式配置，无需（也无法）在此用 Key=Value 开关：
#   1. 脚本内的 Lua 常量 / 表（在模组仓库的 .lua 文件里直接改）；
#   2. 游戏内聊天命令（具体命令以模组 README / 客户端插件为准）。
# 它由 mod-ale（ALE 引擎）加载，依赖 ALE.Enabled=1 与 ALE.ScriptPath 指向的 lua_scripts 目录。
#
# 如需调整，请直接编辑部署镜像内 /azerothcore/lua_scripts/ 下的对应 .lua，
# 或在本仓库对应 lua 模组源码处修改后重新构建。
#
# 故此处无可注释的设置项——保留此说明以补全模组清单。
