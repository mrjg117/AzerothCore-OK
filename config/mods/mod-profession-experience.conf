#
# mod-profession-experience（专业技能经验模组）
# 用途：让角色通过练习专业技能（采集、制造等）获得角色经验值，可按技能难度、技能等级区间、
#       经验曲线及各专业分别配置倍率。以下所有设置默认全部注释，按需取消注释进行调整。
#

[worldserver]

########################################
# ===== 按技能难度倍率 (Difficulty Multipliers) =====
########################################
# 使用对应难度技能时获得经验的倍率。

# 灰（已无经验，最低难度）技能经验倍率 - 默认 0.0
# ProfessionExperience.MultGray   = 0.0

# 绿（轻松）技能经验倍率 - 默认 0.75
# ProfessionExperience.MultGreen  = 0.75

# 黄（普通）技能经验倍率 - 默认 1.0
# ProfessionExperience.MultYellow = 1.0

# 橙（困难）技能经验倍率 - 默认 1.25
# ProfessionExperience.MultOrange = 1.25

########################################
# ===== 按技能等级区间倍率 (Skill Range Multipliers) =====
########################################
# 在对应技能等级区间内使用技能时获得的经验倍率。

# 学徒 (1-75) 区间倍率 - 默认 1.0
# ProfessionExperience.MultApprentice  = 1.0

# 熟练 (76-150) 区间倍率 - 默认 1.0
# ProfessionExperience.MultJourneyman  = 1.0

# 专家 (151-225) 区间倍率 - 默认 1.0
# ProfessionExperience.MultExpert      = 1.0

# 工匠 (226-300) 区间倍率 - 默认 1.0
# ProfessionExperience.MultArtisan     = 1.0

# 大师 (301-375) 区间倍率 - 默认 1.0
# ProfessionExperience.MultMaster      = 1.0

# 宗师 (376-450) 区间倍率 - 默认 1.0
# ProfessionExperience.MultGrandMaster = 1.0

########################################
# ===== 经验曲线倍率 (Curve Multiplier) =====
########################################

# 以指数曲线形式作用于经验：公式"经验 × mult ^ (当前技能/450)"。技能 1 时接近 1，技能 225 时约为平方根；低于 1.0 则在高等级施加惩罚。0.0=关闭 - 默认 5.0
# ProfessionExperience.MultCurve = 5.0

########################################
# ===== 各专业技能经验 (Per-Profession Experience) =====
########################################
# 执行该专业动作时获得的"等级进度占比"（1.0=100% 一级，0.01=1% 一级，0.00=关闭）。

# 炼金术经验占比 - 默认 0.00
# ProfessionExperience.Alchemy.Experience        = 0.00

# 锻造经验占比 - 默认 0.00
# ProfessionExperience.Blacksmith.Experience     = 0.00

# 烹饪经验占比 - 默认 0.00
# ProfessionExperience.Cooking.Experience        = 0.00

# 分解（附魔材料）经验占比 - 默认 0.00
# ProfessionExperience.Disenchanting.Experience  = 0.00

# 附魔经验占比 - 默认 0.00
# ProfessionExperience.Enchanting.Experience     = 0.00

# 工程学经验占比 - 默认 0.00
# ProfessionExperience.Engineering.Experience    = 0.00

# 钓鱼经验占比（1%） - 默认 0.01
# ProfessionExperience.Fishing.Experience        = 0.01

# 急救经验占比 - 默认 0.00
# ProfessionExperience.FirstAid.Experience       = 0.00

# 草药学经验占比（1%） - 默认 0.01
# ProfessionExperience.Herbalism.Experience      = 0.01

# 铭文经验占比 - 默认 0.00
# ProfessionExperience.Inscription.Experience    = 0.00

# 珠宝加工经验占比 - 默认 0.00
# ProfessionExperience.Jewelcrafting.Experience  = 0.00

# 制皮经验占比 - 默认 0.00
# ProfessionExperience.Leatherworking.Experience = 0.00

# 开锁经验占比 - 默认 0.00
# ProfessionExperience.Lockpick.Experience       = 0.00

# 采矿经验占比（1%） - 默认 0.01
# ProfessionExperience.Mining.Experience         = 0.01

# 剥皮经验占比 - 默认 0.00
# ProfessionExperience.Skinning.Experience       = 0.00

# 熔炼经验占比 - 默认 0.00
# ProfessionExperience.Smelting.Experience       = 0.00

# 裁缝经验占比 - 默认 0.00
# ProfessionExperience.Tailoring.Experience      = 0.00
