# =========================================
# mod-all-flightpaths 模组配置（全飞行点解锁）
# 用途：玩家登录时自动解锁所有符合阵营的飞行路线（东/卡利姆多、外域、诺森德），无需逐步探索。
# 说明：本文件所有设置均已注释，按需取消注释（去掉行首 # ）以启用。
# =========================================

# ===== 基础设置 =====

# 总开关：登录时授予所有阵营对应的飞行点（对立阵营专属枢纽不授予） - 默认 1（启用）
# AllFlightPaths.Enable = 1

# ===== 通告 =====

# 登录时密语玩家告知飞行路线已解锁 - 默认 0（禁用，1=启用）
# AllFlightPaths.Announce = 0
