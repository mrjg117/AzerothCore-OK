# =====================================================================
# mod-ale 模组配置（Lua 引擎 / Ale 框架）
# 用途：在 AzerothCore 中运行 Lua / MoonScript 脚本，实现服务端逻辑扩展。
# 本文件所有设置均默认注释关闭，请按需取消「# 」前缀开启。
# =====================================================================

[worldserver]

###################################################################################################
# ===== 一、总开关 =====
# 控制 ALE Lua 引擎是否启用。

# 是否启用 ALE Lua 引擎；true 开启，false 关闭 - 默认 true
# ALE.Enabled = true

###################################################################################################
# ===== 二、错误处理与调试 =====
# 控制 Lua 报错时的输出方式。

# 是否在 Lua 报错时使用 debug.traceback 输出调用栈（可自定义该函数）；false 用默认错误输出，true 用 traceback - 默认 false
# ALE.TraceBack = false

###################################################################################################
# ===== 三、脚本加载路径 =====
# 指定 Lua 脚本目录及额外的 require 搜索路径（支持相对/绝对路径）。

# Lua 脚本目录路径，相对或绝对路径均可，引擎从此目录加载脚本 - 默认 "lua_scripts"
# ALE.ScriptPath = "lua_scripts"

# 额外的 Lua require 搜索路径（绝对路径，遵循标准 Lua require 规则，多个用分号分隔）；留空表示不追加 - 默认 ""
# ALE.RequirePaths = ""

# 额外的 Lua require C 搜索路径（绝对路径，用于加载 .so 等原生库，多个用分号分隔）；留空表示不追加 - 默认 ""
# ALE.RequireCPaths = ""

###################################################################################################
# ===== 四、自动重载（开发环境用） =====
# 监听脚本目录变化并自动重载，建议生产环境关闭。

# 是否在脚本文件新增/修改/删除时自动重载 Lua 脚本；开发实用，生产环境建议关闭 - 默认 false
# ALE.AutoReload = false

# 自动重载时的文件系统检查间隔，单位：秒；数值越小检测越快但更耗 CPU，越大越省 CPU 但延迟更高 - 默认 1
# ALE.AutoReloadInterval = 1

###################################################################################################
# ===== 五、性能优化 =====
# 通过字节码缓存加速脚本重载。

# 是否启用字节码缓存（将 Lua/MoonScript 编译为字节码缓存在内存中，显著加快 .reload ALE 重载速度；文件改动或重启时清空缓存） - 默认 true
# ALE.BytecodeCache = true

###################################################################################################
# ===== 六、玩家通知 =====
# 控制重载公告是否对玩家可见。

# 重载公告是否发送给玩家（仅对最低安全等级玩家可见）；false 不发送，true 发送 - 默认 false
# ALE.PlayerAnnounceReload = false

###################################################################################################
# ===== 七、日志系统 =====
# 配置 ALE 日志的输出位置与级别（Appender=输出到哪里，Logger=记录什么）。
# 格式：Appender.名称=类型,日志级别,标志,可选参数1,可选参数2,可选参数3
#   类型：0 无 / 1 控制台 / 2 文件 / 3 数据库
#   日志级别：0 关闭 / 1 致命 / 2 错误 / 3 警告 / 4 信息 / 5 调试 / 6 跟踪
# 格式：Logger.名称=日志级别,Appender列表（空格分隔）

# 文件日志输出器：类型2(文件)，级别5(调试)，标志0，输出到文件 ALE.log，模式 w(覆盖写入) - 默认 2,5,0,ALE.log,w
# Appender.ALELog=2,5,0,ALE.log,w

# 控制台日志输出器：类型1(控制台)，级别4(信息)，标志0，颜色串 "0 9 0 3 5 0"（致命红/错误红/警告棕/信息蓝/调试灰/跟踪黑） - 默认 1,4,0,"0 9 0 3 5 0"
# Appender.ALEConsole=1,4,0,"0 9 0 3 5 0"

# ALE 日志记录器：级别4(信息)，输出到 ALELog 与 ALEConsole 两个输出器 - 默认 4,ALELog ALEConsole
# Logger.ALE=4,ALELog ALEConsole
