# =========================================
# mod-playerbots-artisans 模组配置（工匠机器人 / Playerbot Artisans）
# 用途：让工匠类玩家机器人通过聊天公布自己真实掌握的配方进行招揽，并可与密语询问的玩家互动，营造“活在世界中”的氛围。
# 说明：本文件所有设置均已注释，按需取消注释（去掉行首 # ）以启用。
# =========================================

[worldserver]

# ===== 总开关 =====

# 模组总开关 - 默认 1（启用，0=禁用）
# PlayerbotArtisans.Enable = 1

# ===== 广告节奏 =====

# 每批广告之间的间隔（秒） - 默认 45（秒）
# PlayerbotArtisans.TickSeconds = 45

# 每批发布的广告条数（保持低位以避免交易频道刷屏） - 默认 2（条）
# PlayerbotArtisans.AdsPerTick = 2

# 机器人发布广告所需的最低专业技能等级 - 默认 100（技能点）
# PlayerbotArtisans.MinSkill = 100

# 单条广告中列出的配方数量 - 默认 2（个）
# PlayerbotArtisans.AdvertiseCount = 2

# 同一个机器人再次发布广告前的冷却时间（秒） - 默认 900（秒）
# PlayerbotArtisans.PerBotCooldownSeconds = 900

# ===== 发布渠道 =====

# 在交易频道发布广告 - 默认 1（启用，0=禁用）
# PlayerbotArtisans.UseTradeChannel = 1

# 同时在机器人当前所在区域的综合频道发布广告 - 默认 0（禁用，1=启用）
# PlayerbotArtisans.UseGeneralChannel = 0

# ===== 交互（v0.2） =====

# 发布真实可点击的物品/附魔链接（而非纯文本 [名称]），玩家可 Shift 点击查看 - 默认 1（启用，0=禁用）
# PlayerbotArtisans.UseItemLinks = 1

# 回答密语询问的玩家：机器人说明其工种、最佳配方与条件（尚不接受订单） - 默认 1（启用，0=禁用）
# PlayerbotArtisans.AnswerWhispers = 1

# 密语回复中列出的配方数量 - 默认 5（个）
# PlayerbotArtisans.WhisperRecipeCount = 5

# 机器人记住自己曾发布过哪个专业的时长（秒），以便密语得到正确工种的回复 - 默认 3600（秒）
# PlayerbotArtisans.WhisperMemorySeconds = 3600

# 在多条广告文案间轮换措辞，避免繁忙交易频道像同一脚本自言自语 - 默认 1（启用，0=禁用）
# PlayerbotArtisans.VaryAdWording = 1
