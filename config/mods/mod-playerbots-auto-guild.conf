#
# mod-playerbots-auto-guild —— 玩家机器人自动入会模组
# 用途：自动把所有上线的玩家机器人（playerbots）分配到对应阵营的机器人公会中，便于统一管理。
# 下方所有设置均已被注释掉（以 # 开头），按需取消注释（去掉行首 # ）即可启用。
#

# [worldserver]  # 配置段标识：以下设置属于 worldserver 配置段

# ===== 部落机器人公会 =====

# 部落机器人公会的 Guild ID。若设为 0，模组会按 HordeGuildName 名称来解析公会。默认 0。
# PlayerbotsAutoGuild.HordeGuildId = 0

# 部落机器人公会的名称（仅当 HordeGuildId 为 0 时使用）。默认 ""（空）。
# PlayerbotsAutoGuild.HordeGuildName = ""

# ===== 联盟机器人公会 =====

# 联盟机器人公会的 Guild ID。若设为 0，模组会按 AllianceGuildName 名称来解析公会。默认 0。
# PlayerbotsAutoGuild.AllianceGuildId = 0

# 联盟机器人公会的名称（仅当 AllianceGuildId 为 0 时使用）。默认 ""（空）。
# PlayerbotsAutoGuild.AllianceGuildName = ""

# ===== 行为 =====

# 强制分配：为 true 时，机器人会被移出当前所在公会并加入其阵营对应的机器人公会；为 false 时，已在某公会中的机器人保持不变。默认 false。
# PlayerbotsAutoGuild.ForceAssign = false

# 扫描间隔：周期性扫描的运行间隔（秒），确保全部在线机器人都已加入其阵营公会。默认 60（秒）。
# PlayerbotsAutoGuild.CheckIntervalSeconds = 60
