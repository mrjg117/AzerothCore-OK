#
# mod-optimal-bot-raid（最优机器人团本编组模组）
# 用途：按算法自动挑选/编组玩家机器人团队（团本、副本、战场），综合考虑装等归一化分数
#       与各职业 WotLK 增益协同，并严格执行坦克/治疗/近战的数量配额。以下设置默认全部
#       注释，按需取消注释即可调整算法权重与配额。
#

[worldserver]

# ==============================================================================
# ===== 算法权重 (Algorithm Heuristic Weights) =====
# ==============================================================================
# 机器人的"最终评分"由归一化装等（相对池中最高装等）与协同增益评分加权得出。

# 装等归一化分数在最终评分中的权重（范围 0.0~10.0） - 默认 0.5
# OptimalBotRaid.Algo.Weight.GS = 0.5

# 增益协同分数在最终评分中的权重（范围 0.0~10.0） - 默认 0.5
# OptimalBotRaid.Algo.Weight.Buff = 0.5

# ==============================================================================
# ===== 协同增益评分 (Synergy Buff Scoring) =====
# ==============================================================================
# 通过位运算矩阵评估 WotLK 增益重叠。若某机器人带来团队尚缺的 WotLK 增益，则加分。
# 以下所有加分值范围均为 0.0~10.0。

# 每带来一个独特 WotLK 增益的基础加分 - 默认 0.2
# OptimalBotRaid.Algo.Bonus.UniqueBuff = 0.2

# 嗜血/英勇（Bloodlust/Heroism）的额外高分加成 - 默认 0.4
# OptimalBotRaid.Algo.Bonus.Bloodlust = 0.4

# 回蓝（Replenishment）的额外加分 - 默认 0.2
# OptimalBotRaid.Algo.Bonus.Replenishment = 0.2

# ==============================================================================
# ===== 团队角色配额（按团队规模） (Target Role Quotas by Raid Size) =====
# ==============================================================================
# 算法严格按配额组队以保证 Boss 存活，优先远程 DPS 以防顺劈机制团灭。
# 远程 DPS 数量由剩余容量自动计算。所有值范围 0~[团队规模]，配置不当会被自动钳制。

# --- 5 人地下城 ---
# 坦克数量配额 - 默认 1
# OptimalBotRaid.Quota.5.Tanks = 1

# 治疗数量配额 - 默认 1
# OptimalBotRaid.Quota.5.Healers = 1

# 近战 DPS 上限 - 默认 1
# OptimalBotRaid.Quota.5.MeleeMax = 1

# --- 10 人团本 ---
# 坦克数量配额 - 默认 2
# OptimalBotRaid.Quota.10.Tanks = 2

# 治疗数量配额 - 默认 2
# OptimalBotRaid.Quota.10.Healers = 2

# 近战 DPS 上限 - 默认 2
# OptimalBotRaid.Quota.10.MeleeMax = 2

# --- 15 人场景/战场 ---
# 坦克数量配额 - 默认 2
# OptimalBotRaid.Quota.15.Tanks = 2

# 治疗数量配额 - 默认 3
# OptimalBotRaid.Quota.15.Healers = 3

# 近战 DPS 上限 - 默认 3
# OptimalBotRaid.Quota.15.MeleeMax = 3

# --- 20 人团本 ---
# 坦克数量配额 - 默认 2
# OptimalBotRaid.Quota.20.Tanks = 2

# 治疗数量配额 - 默认 4
# OptimalBotRaid.Quota.20.Healers = 4

# 近战 DPS 上限 - 默认 5
# OptimalBotRaid.Quota.20.MeleeMax = 5

# --- 25 人团本 ---
# 坦克数量配额 - 默认 2
# OptimalBotRaid.Quota.25.Tanks = 2

# 治疗数量配额 - 默认 5
# OptimalBotRaid.Quota.25.Healers = 5

# 近战 DPS 上限 - 默认 6
# OptimalBotRaid.Quota.25.MeleeMax = 6

# --- 40 人经典旧世团本（平均等级<=60） ---
# 坦克数量配额 - 默认 4
# OptimalBotRaid.Quota.40Vanilla.Tanks = 4

# 治疗数量配额 - 默认 10
# OptimalBotRaid.Quota.40Vanilla.Healers = 10

# 近战 DPS 上限 - 默认 10
# OptimalBotRaid.Quota.40Vanilla.MeleeMax = 10

# --- 40 人巫妖王团本（平均等级>60） ---
# 坦克数量配额 - 默认 3
# OptimalBotRaid.Quota.40WotLK.Tanks = 3

# 治疗数量配额 - 默认 8
# OptimalBotRaid.Quota.40WotLK.Healers = 8

# 近战 DPS 上限 - 默认 10
# OptimalBotRaid.Quota.40WotLK.MeleeMax = 10

# ==============================================================================
# ===== 各职业 AI 能力倍率（按天赋系） (AI Competency Multipliers by Class & Spec) =====
# ==============================================================================
# 对机器人装等施加的静态倍率，反映玩家机器人 AI 在某天赋系（左=0，中=1，右=2）的真实水平。
# 所有值范围 0.1~10.0。

# --- 死亡骑士（0:血，1:冰，2:邪） ---
# 血DK 倍率 - 默认 1.2
# OptimalBotRaid.AI.DK.0 = 1.2

# 冰DK 倍率 - 默认 1.5
# OptimalBotRaid.AI.DK.1 = 1.5

# 邪DK 倍率 - 默认 0.6
# OptimalBotRaid.AI.DK.2 = 0.6

