#
# mod-mythic-plus —— 史诗钥石（大秘境）模组
# 用途：为服务器加入类似《魔兽世界》大秘境（M+）的钥石地下城玩法：计时、死亡惩罚、钥石掉落与购买。
# 下方所有设置均已被注释掉（以 # 开头），按需取消注释（去掉行首 # ）即可启用。
# 作者：silviu20092
#

# [worldserver]  # 配置段标识：以下设置属于 worldserver 配置段

# ===== 总开关 =====

# 模组总开关：是否启用大秘境系统。注意此配置不支持热重载。默认 1（启用）。0 = 关闭。
# MythicPlus.Enable = 1

# ===== 玩法与计时 =====

# 死亡惩罚：玩家在 M+ 地下城内死亡时，从计时器中扣除的秒数。默认 15（扣 15 秒）。0 = 无惩罚；>0 = 扣除对应秒数。
# MythicPlus.Penalty.OnDeath = 15

# 钥石购买冷却：限制从 NPC 处购买史诗钥石的时间间隔（单位：分钟）。默认 1440（每天可买一次）。0 = 不限制，随时可买；60 = 每 60 分钟可买一次。
# MythicPlus.KeystoneBuyTimer = 1440

# 通关掉落钥石：当 M+ 地下城完成（且玩家需在计时内通关）时，是否为每位玩家掉落一枚史诗钥石。默认 1（掉落）。0 = 不掉落。
# MythicPlus.DropKeystoneOnDungeonComplete = 1
