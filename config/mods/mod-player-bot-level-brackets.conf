# ============================================================================
# mod-player-bot-level-brackets（玩家机器人等级分段模组）
# 用途：将玩家机器人按等级划分到多个"分段(bracket)"，并按百分比分布，模拟自然的人口等级曲线。
#       所有设置默认均注释关闭，按需取消注释开启。
# ============================================================================

[worldserver]

# ============================================================================
# 总开关与调试（General / Debug）
# ============================================================================

# 模组总开关。 - 默认 1（1=启用，0=关闭）
# BotLevelBrackets.Enabled = 1
# 完整调试日志。 - 默认 0（0=关，1=开）
# BotLevelBrackets.FullDebugMode = 0
# 精简调试日志。 - 默认 0（0=关，1=开）
# BotLevelBrackets.LiteDebugMode = 0

# ============================================================================
# 检查频率与处理（Check Frequency / Processing）
# ============================================================================

# 机器人等级分布检查的执行频率（秒）。 - 默认 300
# BotLevelBrackets.CheckFrequency = 300
# 对"安全机器人"重置等级、以及处理初次安全检查未通过机器人的频率（秒）。 - 默认 15
# BotLevelBrackets.CheckFlaggedFrequency = 15
# 每个待处理等级变更步骤中最多处理的"被标记机器人"数量。0=无限制（每步全部处理）。 - 默认 5
# BotLevelBrackets.FlaggedProcessLimit = 5

# ============================================================================
# 排除规则（Exclusions）
# ============================================================================

# 启用后，与至少一个真实(非机器人)玩家同公会的机器人，将被排除在分段计算之外，不会被改等级或标记。
# 现在通过持久化数据库跟踪，对在线/离线真实玩家均生效。 - 默认 1（1=启用，0=禁用）
# BotLevelBrackets.IgnoreGuildBotsWithRealPlayers = 1
# 启用后，竞技队伍成员机器人被排除在分段计算之外（避免破坏队伍组成）。 - 默认 1（1=启用，0=禁用）
# BotLevelBrackets.IgnoreArenaTeamBots = 1
# 持久化公会跟踪数据库的更新频率（秒），跟踪哪些公会有真实玩家（即使离线）。 - 默认 600（10分钟）
# BotLevelBrackets.GuildTrackerUpdateFrequency = 600
# 忽略真实玩家好友列表中的机器人，将其排除在所有分段之外。 - 默认 1（1=启用，0=禁用）
# BotLevelBrackets.IgnoreFriendListed = 1
# 逗号分隔、忽略大小写的机器人名字列表，排除在所有分段检查之外。 - 默认 ""
# BotLevelBrackets.ExcludeNames =

# ============================================================================
# 分段数量与动态分布（Brackets / Dynamic Distribution）
# ============================================================================

# 机器人分布所用的等级分段数量。联盟与部落下方必须定义相同数量的分段。 - 默认 9
# BotLevelBrackets.NumRanges = 9
# 启用后，依据每个分段内真实(非机器人)玩家数动态重算机器人分布百分比，覆盖配置中的自定义分段。 - 默认 0（0=关，1=开）
# BotLevelBrackets.Dynamic.UseDynamicDistribution = 0
# 动态分布时，含有真实玩家的分段获得的额外权重倍率（非百分比）。0.0=均匀分配；1.0=默认温和；3.0/5.0=更集中。 - 默认 1.0
# BotLevelBrackets.Dynamic.RealPlayerWeight = 1.0
# 启用后，联盟与部落必须使用完全相同的分段定义（数量、等级区间一致），所有真实玩家共同影响双方分布。
# 警告：启用时若分段不匹配，服务器将无法启动。 - 默认 0（0=关，1=开）
# BotLevelBrackets.Dynamic.SyncFactions = 0

# ============================================================================
# 联盟等级分段（Alliance Level Brackets）
# 每个分段需指定下界(含)/上界(含)/占比(%)。所有分段占比之和须等于 100。
