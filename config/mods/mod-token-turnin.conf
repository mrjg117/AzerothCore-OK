#
# mod-token-turnin —— 代币回收模组
# 用途：提供 .tokenturnin check|redeem 命令，将队伍 / 团队（或机器人）成员的代币批量兑换 / 回收，便于 bot 管理。
# 下方所有设置均已被注释掉（以 # 开头），按需取消注释（去掉行首 # ）即可启用。
#

# [worldserver]  # 配置段标识：以下设置属于 worldserver 配置段

# ===== 总开关 =====

# 是否启用 .tokenturnin check|redeem 命令。默认 1（启用）。0 = 关闭。
# TokenTurnIn.Enable = 1

# ===== 作用范围 =====

# 包含自己：扫描 / 转换时是否包含调用命令的玩家自身角色，而不仅仅是队伍 / 团队成员。默认 0（关闭，仅 bot / 队员）。1 = 同时转换调用者自己的代币。
# TokenTurnIn.IncludeSelf = 0

# 包含真实玩家：是否包含真实（非 bot）的队伍 / 团队成员，不仅限于 playerbots（需编译进 mod-playerbots）。警告：启用后，任何队员执行 .tokenturnin redeem 都会未经同意地转换其他真实玩家的代币，除非全体队员都预期如此，否则请保持关闭。默认 0（仅 playerbots）。1 = 同时转换真实玩家的代币。
# TokenTurnIn.IncludeRealPlayers = 0
