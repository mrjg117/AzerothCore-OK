#
# mod-classic-warrior-additions（经典战士增强模组）
# 用途：为战士职业补充经典旧世的战斗特性——雷霆一击扩散撕裂、雷霆一击附带攻击强度加成、
#       以及低等级双持命中补偿。以下所有设置默认全部注释，按需取消注释进行调整。
#

[worldserver]

###################################################################################################
# ===== 全局 (GLOBAL) =====
###################################################################################################

# 总开关。关闭后无论各子功能如何设置，整个模组均失效（1=启用，0=禁用） - 默认 1
# WarriorAdditions.Enable = 1

###################################################################################################
# ===== 雷霆一击-撕裂扩散 (Thunderclap Rend Spread) =====
###################################################################################################

# 是否启用「雷霆一击时把撕裂扩散给范围内无撕裂的单位」（1=启用，0=禁用） - 默认 1
# WarriorAdditions.RendSpread.Enable = 1

# 扩散时是否只使用当前目标(GetVictim)所带撕裂的精确等级（1=只扩散当前目标等级；0=取范围内最高等级撕裂扩散） - 默认 0
# WarriorAdditions.RendSpread.SpreadSameRank = 0

# 扩散时是否也刷新已带撕裂的单位（1=刷新持续时间并升级等级；0=跳过已有撕裂的单位） - 默认 1
# WarriorAdditions.RendSpread.RefreshOnSpread = 1

# 触发扩散所需战士持有的被动天赋光环 Spell ID（用 HasAura 判定，仅对持续被动光环有效）。0=无需天赋 - 默认 0
# WarriorAdditions.RendSpread.RequiresTalentId = 0

# 每次雷霆一击触发扩散的基础概率（百分比）。无 TalentProcList 匹配时使用此项（100=必触发，0=永不触发） - 默认 100
# WarriorAdditions.RendSpread.ProcChance = 100

# 各天赋的触发概率覆盖，逗号分隔的"SpellId:概率"列表。若战士持有其中任一光环，首个匹配覆盖 ProcChance（概率 0~100 浮点）。留空表示始终用 ProcChance - 默认 ""
# WarriorAdditions.RendSpread.TalentProcList = ""

###################################################################################################
# ===== 雷霆一击攻击强度缩放 (Thunderclap Attack Power Scaling) =====
###################################################################################################

# 是否启用「雷霆一击每跳附带攻击强度加成伤害」（1=启用，0=禁用） - 默认 1
# WarriorAdditions.ThunderclapAP.Enable = 1

# 每点力量(STR)为雷霆一击每跳附加的伤害系数，实际加伤=向下取整(STR * 系数)。0.0=关闭，最大 5.0 - 默认 0.20
# WarriorAdditions.ThunderclapAP.StrMultiplier = 0.20

###################################################################################################
# ===== 双持等级缩放 (Dual Wield Level Scaling) =====
###################################################################################################

# 是否启用「低等级双持命中补偿」（1=启用，0=禁用） - 默认 1
# WarriorAdditions.DWLevelScaling.Enable = 1

# 加成降为 0 的等级，建议设为服务器等级上限。达到或高于该等级的战士不再获得加成 - 默认 60
# WarriorAdditions.DWLevelScaling.MaxLevel = 60

# 1 级时给予的最大命中%加成，随等级线性递减至 MaxLevel 为 0。19.0 可在 1 级完全抵消双持白字未命中惩罚 - 默认 19.0
# WarriorAdditions.DWLevelScaling.MaxBonus = 19.0

# 命中%加成的下限。即使达到或超过 MaxLevel 也不会低于此值，可保留永久小额加成。0=无下限（到上限精确为 0） - 默认 0.0
# WarriorAdditions.DWLevelScaling.MinBonus = 0.0
